<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>지도로 보는 바이블 — 예수 공생애 동선</title>
<meta name="description" content="나사렛에서 예루살렘까지, 예수님의 갈릴리·사마리아·유대 공생애 사역 12개 지점을 지도 위에서 순서대로 따라가 보는 페이지.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{
  --bg:#f3efe6; --panel:#fbf8f0; --ink:#2f2a22; --sub:#7a6e5a; --line:#e2d8c2;
  --accent:#c0392b; --gold:#c9a24b; --chip:#2f2a22; --chip-ink:#fbf8f0;
  --route:#2b5d9c; --route-soft:#9bb7da; --place:#1f8a5b; --water:#3d7fb5;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* 상단 바 */
.topbar{position:relative;z-index:500;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px 8px;display:flex;align-items:flex-start;gap:10px}
.back{flex:0 0 auto;text-decoration:none;color:var(--sub);font-size:.82rem;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;white-space:nowrap}
.titlebox{flex:1;min-width:0}
.ttl{font-size:1rem;font-weight:800;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl b{color:var(--route)}
.meta{font-size:.78rem;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 지도 */
.stage{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:#cfe0e6;z-index:0}
.leaflet-container{font-family:inherit}

/* 우측 버튼 */
.fab{position:absolute;right:12px;top:12px;z-index:600;display:flex;flex-direction:column;gap:8px}
.fab button{width:44px;height:44px;border-radius:12px;border:0;background:var(--chip);color:var(--chip-ink);font-size:1.35rem;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);display:grid;place-items:center}
.fab button.small{font-size:.66rem;font-weight:800;line-height:1.15}
.fab button.off{background:#fff;color:var(--sub);border:1px solid var(--line)}

/* 번호 마커 */
.stop-icon{background:none;border:0}
.stop{width:30px;height:30px;border-radius:50%;background:var(--route);color:#fff;font-weight:800;font-size:.88rem;display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .2s,background .2s;cursor:pointer}
.stop.visited{background:#5f84b5}
.stop.active{background:var(--accent);transform:scale(1.28);box-shadow:0 0 0 6px rgba(192,57,43,.22),0 2px 8px rgba(0,0,0,.4)}
.stop-label{position:absolute;left:50%;top:33px;transform:translateX(-50%);white-space:nowrap;font-weight:800;font-size:.86rem;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none}
.stop-label.active{color:var(--accent)}
.stop-label.r{left:36px;top:5px;transform:none}
.stop-label.l{left:auto;right:36px;top:5px;transform:none}
#map.far .stop-label.r,#map.far .stop-label.l{top:6px}

/* 일반 지명 마커 */
.place-icon{background:none;border:0}
.pdot{width:12px;height:12px;border-radius:50%;background:var(--place);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);cursor:pointer}
.plabel{position:absolute;left:50%;top:13px;transform:translateX(-50%);white-space:nowrap;font-size:.76rem;font-weight:700;color:#3e463d;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none}

/* 지역/물 라벨 */
.region-label{background:none;border:0;text-align:center;white-space:nowrap;pointer-events:none}
.region-label b{display:block;font-size:.95rem;letter-spacing:.06em;text-shadow:0 0 4px #fff,0 0 4px #fff}
.region-label span{display:block;font-size:.68rem;color:var(--sub);text-shadow:0 0 3px #fff,0 0 3px #fff}
.water-label{background:none;border:0;white-space:nowrap;font-style:italic;font-size:.8rem;color:var(--water);text-shadow:0 0 3px #e8f1f6,0 0 3px #e8f1f6;pointer-events:none;text-align:center}

/* 하단 카드 */
.card{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100% - 24px));z-index:700;background:rgba(36,32,27,.94);color:#f4efe4;border-radius:18px;padding:14px 16px 14px;box-shadow:0 12px 32px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.card[hidden]{display:none}
.card-head{display:flex;align-items:center;gap:10px}
.badge{flex:0 0 auto;font-weight:800;font-size:.86rem;color:#9fc0ea;background:rgba(159,192,234,.14);border-radius:8px;padding:4px 9px}
.badge.place{color:#9ed8b8;background:rgba(158,216,184,.14)}
.card h2{font-size:1.2rem;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.close{flex:0 0 auto;background:none;border:0;color:#bdb3a2;font-size:1.3rem;cursor:pointer;width:32px;height:32px;border-radius:8px}
.close:hover{background:rgba(255,255,255,.08)}
.names{font-size:.84rem;color:#cfc6b6;margin-top:6px}
.verse{margin-top:8px;font-size:.95rem;line-height:1.55}
.verse .ref{color:#e8cf8a;font-weight:800;margin-right:4px}
.extra{margin-top:6px;font-size:.82rem;color:#bdb3a2;line-height:1.5}
.nav{display:flex;gap:10px;margin-top:12px}
.nav button{flex:1;height:44px;border:0;border-radius:12px;background:var(--route);color:#fff;font-size:1.05rem;font-weight:800;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav button.play{flex:0 0 64px;background:#4a4337;font-size:.8rem}
.progress{height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:#9fc0ea;transition:width .3s}

/* 목록 패널 */
.list{position:absolute;right:66px;top:12px;z-index:650;width:min(300px,calc(100% - 90px));max-height:calc(100% - 200px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.2);padding:6px}
.list[hidden]{display:none}
.list h3{font-size:.78rem;color:var(--sub);padding:8px 10px 4px}
.list button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;font:inherit;color:var(--ink)}
.list button:hover,.list button.on{background:#efe6d2}
.list .n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--route);color:#fff;font-size:.76rem;font-weight:800;display:grid;place-items:center}
.list .t{font-size:.9rem;font-weight:700}
.list .s{display:block;font-size:.74rem;color:var(--sub);font-weight:400}

.leaflet-control-scale{margin-left:12px!important;margin-top:10px!important}
.leaflet-control-scale-line{background:rgba(251,248,240,.85);border-color:var(--ink);color:var(--ink)}
.leaflet-control-attribution{font-size:.62rem}
/* 축소 시 라벨 정리 */
#map.far .stop-label:not(.active){font-size:.7rem;top:27px}
#map.far .plabel,#map.far .region-label span{display:none}
#map.far .stop{width:24px;height:24px;font-size:.74rem;margin:3px}
@media (min-width:900px){
  .card{left:16px;transform:none;width:400px}
}
@media (max-width:520px){
  .ttl{font-size:.92rem}
  .card{padding:12px 13px}
  .card h2{font-size:1.08rem}
  .verse{font-size:.9rem}
}
</style>
</head>

    {"name":"유대","sub":"로마 총독 관할","lat":31.62,"lng":35.02,"color":"#b0412f"},
    {"name":"데가볼리","sub":"10개 헬라 도시 연맹","lat":32.55,"lng":35.78,"color":"#2f7d5a"},
    {"name":"베레아","sub":"헤롯 안디바 관할","lat":31.98,"lng":35.70,"color":"#2b7f8a"},
    {"name":"이두래","sub":"분봉왕 빌립 관할","lat":33.10,"lng":35.88,"color":"#a0702b"}
  ],
  "water": [
    {"name":"갈릴리 바다","lat":32.835,"lng":35.585},
    {"name":"사해 (염해)","lat":31.53,"lng":35.49},
    {"name":"요단강","lat":32.25,"lng":35.58},
    {"name":"지중해","lat":32.20,"lng":34.62}
  ]
}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function(){
const DATA=JSON.parse(document.getElementById("data").textContent);
const R=DATA.route, N=R.length;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const map=L.map("map",{zoomControl:false,minZoom:7,maxZoom:13,zoomSnap:.25});
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png",{
  subdomains:"abcd",maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
}).addTo(map);
L.control.scale({position:"topleft",metric:true,imperial:false,maxWidth:120}).addTo(map);

/* 지역·물 라벨 */
DATA.regions.forEach(r=>L.marker([r.lat,r.lng],{interactive:false,keyboard:false,icon:L.divIcon({className:"region-label",iconSize:[140,36],iconAnchor:[70,18],
  html:`<b style="color:${r.color}">${esc(r.name)}</b><span>${esc(r.sub)}</span>`})}).addTo(map));
DATA.water.forEach(w=>L.marker([w.lat,w.lng],{interactive:false,keyboard:false,icon:L.divIcon({className:"water-label",iconSize:[110,18],iconAnchor:[55,9],html:esc(w.name)})}).addTo(map));

/* 곡선 경로: 두 점 사이를 살짝 휘게 (2차 베지어) */
function curve(a,b,bend){
  const [x1,y1]=[a.lng,a.lat],[x2,y2]=[b.lng,b.lat];
  const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1;
  const cx=mx-dy*bend, cy=my+dx*bend, pts=[];
  for(let t=0;t<=1.0001;t+=1/24){const u=1-t;pts.push([u*u*y1+2*u*t*cy+t*t*y2,u*u*x1+2*u*t*cx+t*t*x2]);}
  return pts;
}
const segs=[];
for(let i=0;i<N-1;i++){
  const pts=curve(R[i],R[i+1],(i%2?-1:1)*0.18);
  const casing=L.polyline(pts,{color:"#fff",weight:7,opacity:.85,interactive:false}).addTo(map);
  const line=L.polyline(pts,{color:"#2b5d9c",weight:3.5,dashArray:"2 7",lineCap:"round",opacity:.9,interactive:false}).addTo(map);
  segs.push({casing,line});
}

/* 기타 지명 마커 (P1·P2) */
const placeLayer=L.layerGroup().addTo(map);
DATA.places.forEach(p=>{
  L.marker([p.lat,p.lng],{title:p.name,icon:L.divIcon({className:"place-icon",iconSize:[12,12],iconAnchor:[6,6],
    html:`<div class="pdot"></div><div class="plabel">${esc(p.name)}</div>`})})
   .on("click",()=>showPlace(p)).addTo(placeLayer);
});

/* 동선 번호 마커 (P3) */
const stops=R.map((s,i)=>{
  const m=L.marker([s.lat,s.lng],{title:`${i+1}. ${s.name}`,zIndexOffset:1000,keyboard:true,
    icon:L.divIcon({className:"stop-icon",iconSize:[30,30],iconAnchor:[15,15],
      html:`<div class="stop" data-i="${i}">${i+1}</div><div class="stop-label ${s.lab||""}">${esc(s.name)}</div>`})}).addTo(map);
  m.on("click",()=>go(i));
  return m;
});

/* 목록 */
$("list").innerHTML="<h3>공생애 동선 12지점</h3>"+R.map((s,i)=>`<button data-i="${i}"><span class="n">${i+1}</span><span class="t">${esc(s.name)}<span class="s">${esc(s.ref)}</span></span></button>`).join("");
$("list").addEventListener("click",e=>{const b=e.target.closest("button");if(b){go(+b.dataset.i);if(innerWidth<700)$("list").hidden=true;}});

let cur=0, timer=null;
function paint(){
  stops.forEach((m,i)=>{
    const el=m.getElement(); if(!el) return;
    const d=el.querySelector(".stop"), l=el.querySelector(".stop-label");
    d.classList.toggle("active",i===cur); d.classList.toggle("visited",i<cur); l.classList.toggle("active",i===cur);
    m.setZIndexOffset(i===cur?3000:1000);
  });
  segs.forEach((s,i)=>{
    const done=i<cur;
    s.line.setStyle({color:done?"#2b5d9c":"#7f9cc4",opacity:done?.95:.55,weight:done?4:3});
  });
  [...$("list").querySelectorAll("button")].forEach((b,i)=>b.classList.toggle("on",i===cur));
}
function fill(o){
  $("cName").textContent=o.name;
  $("cNames").textContent=`${o.en} · 현 ${o.modern}`;
  $("cVerse").innerHTML=`<span class="ref">${esc(o.ref)}</span>— ${esc(o.summary)}`;
  $("cExtra").textContent=o.extra||""; $("cExtra").hidden=!o.extra;
  $("card").hidden=false;
}
function go(i,opt={}){
  cur=Math.max(0,Math.min(N-1,i));
  const s=R[cur];
  $("badge").className="badge"; $("badge").textContent=`${cur+1} / ${N}`;
  $("cNav").hidden=false; $("cProg").hidden=false;
  $("cBar").style.width=((cur+1)/N*100)+"%";
  $("prev").disabled=cur===0; $("next").disabled=cur===N-1;
  fill(s); paint();
  if(!opt.noPan){
    const z=Math.max(map.getZoom(),10);
    map.flyTo(offsetCenter([s.lat,s.lng],z),z,{duration:.8});
  }
  history.replaceState(null,"","#stop-"+(cur+1));
}
function showPlace(p){
  stopPlay();
  $("badge").className="badge place"; $("badge").textContent="지명";
  $("cNav").hidden=true; $("cProg").hidden=true;
  fill(p);
}
/* 카드에 가리지 않도록 중심을 살짝 아래로 */
function offsetCenter(ll,z){
  const shown=!$("card").hidden;
  const shift=shown?(wide()?[-215,0]:[0,$("card").offsetHeight/2]):[0,0];
  const p=map.project(ll,z).add(shift);
  return map.unproject(p,z);
}
const wide=()=>innerWidth>=900;
function fitAll(){
  const shown=!$("card").hidden;
  const pl=wide()&&shown?430:30, pb=!wide()&&shown?$("card").offsetHeight+30:20;
  map.fitBounds(L.latLngBounds(R.map(s=>[s.lat,s.lng])),{paddingTopLeft:[pl,40],paddingBottomRight:[70,pb]});
}
function stopPlay(){clearInterval(timer);timer=null;$("play").textContent="▶ 재생";}
$("prev").onclick=()=>{stopPlay();go(cur-1)};
$("next").onclick=()=>{stopPlay();go(cur+1)};
$("play").onclick=()=>{
  if(timer){stopPlay();return;}
  if(cur===N-1) go(0);
  $("play").textContent="❚❚ 정지";
  timer=setInterval(()=>{if(cur>=N-1){stopPlay();return;}go(cur+1);},3200);
};
$("cClose").onclick=()=>{stopPlay();$("card").hidden=true;};
$("zin").onclick=()=>map.zoomIn();
$("zout").onclick=()=>map.zoomOut();
$("btnList").onclick=()=>{$("list").hidden=!$("list").hidden;};
$("btnFit").onclick=fitAll;
$("btnPlaces").onclick=e=>{
  const on=map.hasLayer(placeLayer);
  on?map.removeLayer(placeLayer):map.addLayer(placeLayer);
  e.currentTarget.classList.toggle("off",on);
};
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("input,textarea")) return;
  if(e.key==="ArrowRight"){stopPlay();go(cur+1);} else if(e.key==="ArrowLeft"){stopPlay();go(cur-1);}
});
const declutter=()=>$("map").classList.toggle("far",map.getZoom()<9.25);
map.on("zoomend",declutter);
map.on("zoomend moveend",paint);

/* 시작: #stop-5 같은 해시로 특정 지점 열기 */
const h=/^#stop-(\d+)$/.exec(location.hash);
const start=h?Math.min(N,Math.max(1,+h[1]))-1:0;
cur=start; go(start,{noPan:true}); fitAll(); declutter();
if(h){const s=R[start];setTimeout(()=>map.setView(offsetCenter([s.lat,s.lng],10),10),50);}
})();
</script>
</body>
</html>
