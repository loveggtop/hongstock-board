let filtered=[...ALL_REPORTS],currentPage=1,pageSize=10;
function onSearch(){const q=document.getElementById('searchInput').value.toLowerCase();filtered=ALL_REPORTS.filter(r=>r.title.toLowerCase().includes(q)||r.date.includes(q));currentPage=1;render();}
function onPageSizeChange(){pageSize=parseInt(document.getElementById('pageSize').value);currentPage=1;render();}
function render(){
const tbody=document.getElementById('tableBody'),emptyMsg=document.getElementById('emptyMsg');
document.getElementById('totalCount').textContent=ALL_REPORTS.length;
if(filtered.length===0){tbody.innerHTML='';emptyMsg.style.display='';document.getElementById('pagination').innerHTML='';return;}
emptyMsg.style.display='none';
const totalPages=pageSize>=9999?1:Math.ceil(filtered.length/pageSize);
if(currentPage>totalPages)currentPage=totalPages;
const start=pageSize>=9999?0:(currentPage-1)*pageSize;
const end=pageSize>=9999?filtered.length:Math.min(start+pageSize,filtered.length);
tbody.innerHTML=filtered.slice(start,end).map((r,i)=>{
const tag=r.tag==='guide'?'<span class="source guide">가이드</span>':'<span class="source">NotebookLM</span>';
const origIdx=ALL_REPORTS.indexOf(r);
return '<tr><td class="num">'+(start+i+1)+'</td><td class="date">'+r.date+'</td><td class="title"><a href="'+r.url+'" target="_blank" rel="noopener">'+r.title+'</a>'+tag+'</td><td class="del"><button class="delBtn" onclick="deleteReportByIndex('+origIdx+',this)">삭제</button></td></tr>';
}).join('');
const pg=document.getElementById('pagination');
if(totalPages<=1){pg.innerHTML='';return;}
let btns='<button onclick="goPage('+(currentPage-1)+')" '+(currentPage===1?'disabled':'')+'>&#8249; 이전</button>';
let pages=new Set([1,totalPages]);
for(let p=Math.max(1,currentPage-2);p<=Math.min(totalPages,currentPage+2);p++)pages.add(p);
pages=[...pages].sort((a,b)=>a-b);let prev=0;
for(const p of pages){if(prev&&p-prev>1)btns+='<button disabled>…</button>';btns+='<button class="'+(p===currentPage?'active':'')+'" onclick="goPage('+p+')">'+p+'</button>';prev=p;}
btns+='<button onclick="goPage('+(currentPage+1)+')" '+(currentPage===totalPages?'disabled':'')+'>다음 &#8250;</button>';
btns+='<span class="page-info">'+currentPage+' / '+totalPages+' 페이지</span>';
pg.innerHTML=btns;
}
function goPage(p){const t=pageSize>=9999?1:Math.ceil(filtered.length/pageSize);if(p<1||p>t)return;currentPage=p;render();window.scrollTo({top:0,behavior:'smooth'});}
function b64EncodeUnicode(str){const bytes=new TextEncoder().encode(str);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin);}
function b64DecodeUnicode(b64){const bin=atob(b64.replace(/\n/g,''));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(bytes);}
async function deleteReportByIndex(idx,btn){
const r=ALL_REPORTS[idx];
if(!r)return;
if(!confirm('"'+r.title+'"\n보고서를 삭제하시겠습니까?\n(GitHub 저장소에서 즉시 삭제됩니다)'))return;
let token=localStorage.getItem('gh_pat');
if(!token){
token=prompt('GitHub Personal Access Token을 입력하세요.\n(이 브라우저에 저장되어 다음부터는 다시 묻지 않습니다)');
if(!token)return;
localStorage.setItem('gh_pat',token);
}
btn.disabled=true;btn.textContent='삭제중...';
try{
const apiUrl='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_PATH;
const getResp=await fetch(apiUrl,{headers:{Authorization:'token '+token,Accept:'application/vnd.github.v3+json'}});
const getData=await getResp.json();
if(!getResp.ok)throw new Error(getData.message||'파일 조회 실패 (status '+getResp.status+')');
const sha=getData.sha;
const decoded=b64DecodeUnicode(getData.content);
const escUrl=r.url.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const entryRe=new RegExp('\\{[^{}]*url:"'+escUrl+'"[^{}]*\\},?\\n?');
if(!entryRe.test(decoded)){localStorage.removeItem('gh_pat');throw new Error('원격 파일에서 해당 항목을 찾지 못했습니다 (이미 삭제되었거나 토큰이 잘못되었을 수 있습니다)');}
let newContent=decoded.replace(entryRe,'');
const countMatch=decoded.match(/<span id="totalCount">(\d+)<\/span>/);
const newCount=countMatch?Math.max(0,parseInt(countMatch[1])-1):undefined;
if(newCount!==undefined)newContent=newContent.replace(/<span id="totalCount">\d+<\/span>/,'<span id="totalCount">'+newCount+'</span>');
const today=new Date().toISOString().slice(0,10);
newContent=newContent.replace(/최종 업데이트: \d{4}-\d{2}-\d{2}/,'최종 업데이트: '+today);
const newBase64=b64EncodeUnicode(newContent);
const putResp=await fetch(apiUrl,{method:'PUT',headers:{Authorization:'token '+token,'Content-Type':'application/json',Accept:'application/vnd.github.v3+json'},body:JSON.stringify({message:'보고서 삭제: '+r.title,content:newBase64,sha:sha})});
const putData=await putResp.json();
if(!putResp.ok){if(putResp.status===401)localStorage.removeItem('gh_pat');throw new Error(putData.message||'업로드 실패 (status '+putResp.status+')');}
ALL_REPORTS.splice(idx,1);
onSearch();
alert('삭제되었습니다. GitHub Pages에는 1~2분 후 반영됩니다.');
}catch(e){
alert('삭제 실패: '+e.message);
btn.disabled=false;btn.textContent='삭제';
}
}
render();
</script>
