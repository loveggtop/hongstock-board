<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>지도로 보는 바이블 — 시대별 세력도</title>
<meta name="description" content="태초부터 초대교회까지 10개 시대를 타임라인으로 넘기며, 시대별 지도 범위·주요 지명·왕국과 속주의 세력도를 한눈에 보는 성경 지도.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{
  --bg:#f3efe6; --panel:#fbf8f0; --ink:#2f2a22; --sub:#7a6e5a; --line:#e2d8c2;
  --accent:#c0392b; --gold:#c9a24b; --chip:#2f2a22; --chip-ink:#fbf8f0;
  --place:#1f8a5b; --capital:#c0642b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* 상단 바 */
.topbar{position:relative;z-index:500;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px 8px;display:flex;align-items:flex-start;gap:10px}
.back{flex:0 0 auto;text-decoration:none;color:var(--sub);font-size:.82rem;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;white-space:nowrap}
.titlebox{flex:1;min-width:0}
.era-title{font-size:1rem;font-weight:800;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.era-title b{color:var(--accent)}
.era-meta{font-size:.78rem;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 지도 */
.stage{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:#cfe0e6;z-index:0}
.leaflet-container{font-family:inherit}

/* 우측 버튼 */
.fab{position:absolute;right:12px;top:12px;z-index:600;display:flex;flex-direction:column;gap:8px}
.fab button{width:44px;height:44px;border-radius:12px;border:0;background:var(--chip);color:var(--chip-ink);font-size:1.35rem;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);display:grid;place-items:center}
.fab button.toggle{font-size:.68rem;font-weight:800;line-height:1.1}
.fab button.toggle.off{background:#fff;color:var(--sub);border:1px solid var(--line)}

/* 시대 타임라인 (좌측) */
.timeline{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:600;padding:10px 10px 10px 0;background:linear-gradient(90deg,rgba(243,239,230,.95) 0%,rgba(243,239,230,.85) 70%,rgba(243,239,230,0) 100%);border-radius:0 16px 16px 0;max-height:calc(100% - 24px);overflow-y:auto}
.timeline ol{list-style:none;position:relative}
.timeline li{position:relative;padding:6px 18px 6px 34px;cursor:pointer;user-select:none}
.timeline li::before{content:"";position:absolute;left:10px;top:50%;width:14px;height:2px;background:#9a8f7c;transform:translateY(-50%)}
.timeline li::after{content:"";position:absolute;left:12px;top:calc(50% - 12px);width:8px;height:1px;background:#c4baa6;box-shadow:0 24px 0 #c4baa6}
.timeline .nm{display:block;font-size:1.02rem;font-weight:700;color:#8a806c;transition:all .2s}
.timeline .bk{display:none;font-size:.72rem;color:var(--sub);margin-top:1px}
.timeline .yr{display:none;font-size:.68rem;color:#a39780}
.timeline li:hover .nm{color:var(--ink)}
.timeline li.on .nm{font-size:1.45rem;font-weight:900;color:var(--ink)}
.timeline li.on .bk,.timeline li.on .yr{display:block}
.timeline li.on::before{left:0;width:24px;height:3px;background:var(--accent)}
.timeline li.on .flag{display:block}
.flag{display:none;position:absolute;left:0;top:50%;transform:translateY(-50%);width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:14px solid var(--accent)}
.tl-arrows{display:flex;gap:6px;padding:4px 0 0 30px}
.tl-arrows button{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:28px;cursor:pointer;color:var(--sub)}

/* 하단 시대 카드 */
.era-card{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:600;width:min(560px,calc(100% - 24px));background:rgba(251,248,240,.97);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);padding:12px 14px}
.era-card.collapsed .ec-body{display:none}
.ec-head{display:flex;align-items:center;gap:8px;cursor:pointer}
.ec-head .pill{background:var(--accent);color:#fff;border-radius:999px;font-size:.72rem;font-weight:800;padding:3px 9px;white-space:nowrap}
.ec-head .ttl{font-weight:800;font-size:.92rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec-head .chev{color:var(--sub);font-size:.8rem}
.ec-body{margin-top:8px;font-size:.86rem;line-height:1.6;color:#4a4236}
.ec-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ec-legend span{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;padding:3px 8px;border-radius:999px;background:#fff;border:1px solid var(--line);cursor:pointer}
.ec-legend i{width:12px;height:9px;border-radius:2px;border:1.5px dashed currentColor;display:inline-block}
.ec-legend span.dim{opacity:.4}

/* 지도 라벨 */
.leaflet-tooltip.pl{background:transparent;border:0;box-shadow:none;padding:0;font-weight:800;color:#1f1b16;font-size:13px;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 4px #fff}
.leaflet-tooltip.pl::before{display:none}
.leaflet-tooltip.pl.cap{font-size:15px}
.leaflet-tooltip.pl.minor{font-weight:700;font-size:11.5px;color:#3d362c}
.hide-minor .leaflet-tooltip.pl.minor{display:none}
.rlabel{white-space:nowrap;font-weight:800;font-size:13px;text-align:center;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 5px #fff;pointer-events:none}
.rlabel small{display:block;font-weight:600;font-size:10.5px;color:#5c5243}
.wlabel{white-space:nowrap;font-style:italic;color:#3f6f8f;font-size:12.5px;font-weight:600;text-shadow:0 0 3px #eaf3f7,0 0 3px #eaf3f7;pointer-events:none}
.tlabel{white-space:nowrap;color:#9a7f55;font-size:11px;font-weight:700;letter-spacing:1px;pointer-events:none;text-shadow:0 0 3px #fff}
.hide-power .rlabel{display:none}
.leaflet-popup-content{margin:12px 14px;font-size:.86rem;line-height:1.55}
.pp h4{font-size:1rem;margin-bottom:2px}
.pp .m{color:var(--sub);font-size:.76rem;margin-bottom:6px}
.pp .v{margin-top:6px;font-size:.76rem;color:#8a5a2b;font-weight:700}
.pin-cap{width:22px;height:22px;border-radius:50%;background:var(--capital);border:3px solid #fff;box-shadow:0 0 0 6px rgba(192,100,43,.25),0 1px 4px rgba(0,0,0,.4)}
.pin{width:13px;height:13px;border-radius:50%;background:var(--place);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.pin.sm{width:10px;height:10px}
.pin.q{background:#fff;border:2.5px solid #b08a2e}
.leaflet-control-scale-line{border-color:#555;border-top:0;background:rgba(255,255,255,.7);font-size:11px}

@media (min-width:900px){
  .timeline{left:0;padding-left:4px}
  .timeline .nm{font-size:1.1rem}
  .timeline li.on .nm{font-size:1.6rem}
  .era-card{left:auto;right:70px;transform:none;bottom:20px}
}
@media (max-width:520px){
  .back{font-size:.74rem;padding:5px 8px}
  .era-title{font-size:.9rem}
  .timeline li{padding:5px 12px 5px 30px}
  .timeline .nm{font-size:.92rem}
  .timeline li.on .nm{font-size:1.2rem}
  .timeline li.on .bk,.timeline li.on .yr{display:none}
  .timeline{padding-right:4px}
  .tl-arrows{padding-left:24px}
  .tl-arrows button{width:28px}
  .era-card{bottom:10px;padding:10px 12px}
  .rlabel{font-size:11.5px}
  .rlabel small{display:none}
  .leaflet-tooltip.pl{font-size:12px}
  .leaflet-tooltip.pl.cap{font-size:13.5px}
}
</style>

/* ────────────── 지도 ────────────── */
const map=L.map("map",{zoomControl:false,worldCopyJump:false,minZoom:4,maxZoom:12,zoomSnap:.25});
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png",{
  subdomains:"abcd",maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
}).addTo(map);
L.control.scale({metric:true,imperial:false,position:"topleft",maxWidth:140}).addTo(map);

const powerLayer=L.layerGroup().addTo(map);
const labelLayer=L.layerGroup().addTo(map);
const placeLayer=L.layerGroup().addTo(map);
let cur=0, baseZoom=6, powerOn=true;
const hidden=new Set();

function pinIcon(kind){
  if(kind==="cap") return L.divIcon({className:"",html:'<div class="pin-cap"></div>',iconSize:[22,22],iconAnchor:[11,11]});
  const cls=kind==="q"?"pin q":kind==="minor"?"pin sm":"pin";
  const s=kind==="minor"?10:13;
  return L.divIcon({className:"",html:`<div class="${cls}"></div>`,iconSize:[s,s],iconAnchor:[s/2,s/2]});
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function drawEra(i,animate){
  const e=ERAS[i]; cur=i; hidden.clear();
  powerLayer.clearLayers(); labelLayer.clearLayers(); placeLayer.clearLayers();

  e.regions.forEach((r,ri)=>{
    const poly=L.polygon(r.p,{color:r.c,weight:2,dashArray:"7 6",fillColor:r.c,fillOpacity:.16,smoothFactor:1.5});
    poly.bindTooltip(`<b>${esc(r.n)}</b>${r.s?"<br>"+esc(r.s):""}`,{sticky:true,direction:"top"});
    poly._ri=ri; powerLayer.addLayer(poly);
    const lab=L.marker(r.at,{interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<div class="rlabel" style="color:${r.c}">${esc(r.n)}${r.s?"<small>"+esc(r.s)+"</small>":""}</div>`,iconSize:null})});
    lab._ri=ri; powerLayer.addLayer(lab);
  });
  (e.water||[]).forEach(w=>labelLayer.addLayer(L.marker([w[1],w[2]],{interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<div class="wlabel">${esc(w[0])}</div>`,iconSize:null})})));
  if(e.route) labelLayer.addLayer(L.polyline(e.route,{color:"#c0392b",weight:3,dashArray:"2 8",lineCap:"round",opacity:.85,interactive:false}));
  (e.tribes||[]).forEach(t=>labelLayer.addLayer(L.marker([t[1],t[2]],{interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<div class="tlabel">${esc(t[0])}</div>`,iconSize:null})})));

  e.places.forEach(p=>{
    const [n,lat,lng,kind,modern,note,ref]=p;
    const m=L.marker([lat,lng],{icon:pinIcon(kind),title:n,riseOnHover:true,zIndexOffset:kind==="cap"?1000:kind==="minor"?0:500});
    m.bindTooltip(esc(n)+(kind==="q"?" ?":""),{permanent:true,direction:"bottom",offset:[0,kind==="cap"?10:5],className:"pl"+(kind==="cap"?" cap":kind==="minor"?" minor":"")});
    m.bindPopup(`<div class="pp"><h4>${esc(n)}</h4><div class="m">현 ${esc(modern)}${kind==="q"?" · 위치 추정":""}</div>${esc(note)}${ref?`<div class="v">📖 ${esc(ref)}</div>`:""}</div>`,{maxWidth:240,autoPanPaddingTopLeft:L.point(document.querySelector('.timeline').offsetWidth+8,40),autoPanPaddingBottomRight:L.point(60,20)});
    placeLayer.addLayer(m);
  });

  // 제목·카드
  document.getElementById("eraTitle").innerHTML=`<b>${esc(e.name)}</b> · ${esc(e.title)}`;
  document.getElementById("eraMeta").textContent=`${e.years} · ${e.books}`;
  document.getElementById("ecPill").textContent=e.name+" 시대";
  document.getElementById("ecTtl").textContent=e.years;
  document.getElementById("ecText").textContent=e.summary;
  const lg=document.getElementById("ecLegend"); lg.innerHTML="";
  e.regions.forEach((r,ri)=>{
    const s=document.createElement("span"); s.style.color=r.c; s.innerHTML=`<i></i><b style="color:var(--ink);font-weight:600">${esc(r.n)}</b>`;
    s.title="눌러서 이 영역 켜기/끄기"; s.onclick=()=>toggleRegion(ri,s); lg.appendChild(s);
  });

  document.querySelectorAll("#tl li").forEach((li,k)=>{li.classList.toggle("on",k===i);li.setAttribute("aria-current",k===i?"true":"false")});
  const on=document.querySelector("#tl li.on"); if(on) on.scrollIntoView({block:"nearest"});

  const pad=fitPadding();
  if(animate) map.flyToBounds(e.bounds,{paddingTopLeft:pad[0],paddingBottomRight:pad[1],duration:1.1});
  else map.fitBounds(e.bounds,{paddingTopLeft:pad[0],paddingBottomRight:pad[1]});
  map.once("moveend",()=>{baseZoom=map.getZoom();updateMinor();});
  try{history.replaceState(null,"","#"+e.id)}catch(_){}
}
function fitPadding(){
  const w=map.getSize().x, tl=document.querySelector(".timeline").offsetWidth, card=document.getElementById("eraCard").offsetHeight;
  return w<700?[[tl*.5,10],[10,card+10]]:[[tl,10],[60,Math.round(card*.6)]];
}
function toggleRegion(ri,chip){
  const off=!hidden.has(ri); off?hidden.add(ri):hidden.delete(ri);
  chip.classList.toggle("dim",off);
  powerLayer.eachLayer(l=>{if(l._ri!==ri)return; const el=l.getElement?l.getElement():null;
    if(l instanceof L.Polygon){l.setStyle({opacity:off?0:1,fillOpacity:off?0:.16});}
    else if(el){el.style.display=off?"none":"";}
  });
}
function updateMinor(){ const need=baseZoom+(map.getSize().x<600?1:0)-.01; map.getContainer().classList.toggle("hide-minor",map.getZoom()<need); }
map.on("zoomend",updateMinor);

/* 타임라인 */
const tl=document.getElementById("tl");
ERAS.forEach((e,k)=>{
  const li=document.createElement("li"); li.tabIndex=0; li.setAttribute("role","button");
  li.innerHTML=`<span class="flag"></span><span class="nm">${esc(e.name)}</span><span class="bk">${esc(e.books)}</span><span class="yr">${esc(e.years)}</span>`;
  li.onclick=()=>{if(k!==cur)drawEra(k,true)};
  li.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();li.click();}};
  tl.appendChild(li);
});
const step=d=>{const n=cur+d; if(n>=0&&n<ERAS.length) drawEra(n,true)};
document.getElementById("prevEra").onclick=()=>step(-1);
document.getElementById("nextEra").onclick=()=>step(1);
document.addEventListener("keydown",ev=>{
  if(ev.target.closest&&ev.target.closest("input,textarea"))return;
  if(ev.key==="ArrowUp"||ev.key==="PageUp"){ev.preventDefault();step(-1)}
  if(ev.key==="ArrowDown"||ev.key==="PageDown"){ev.preventDefault();step(1)}
});
// 타임라인 위에서 휠·스와이프로 시대 넘기기
let wheelLock=0;
document.querySelector(".timeline").addEventListener("wheel",ev=>{ev.preventDefault();ev.stopPropagation();const now=Date.now();if(now-wheelLock<500)return;wheelLock=now;step(ev.deltaY>0?1:-1)},{passive:false});
let ty=null;
document.querySelector(".timeline").addEventListener("touchstart",ev=>{ty=ev.touches[0].clientY},{passive:true});
document.querySelector(".timeline").addEventListener("touchend",ev=>{if(ty===null)return;const dy=ev.changedTouches[0].clientY-ty;ty=null;if(Math.abs(dy)>30)step(dy<0?1:-1)},{passive:true});
L.DomEvent.disableClickPropagation(document.querySelector(".timeline"));
L.DomEvent.disableClickPropagation(document.querySelector(".fab"));
L.DomEvent.disableClickPropagation(document.getElementById("eraCard"));
L.DomEvent.disableScrollPropagation(document.getElementById("eraCard"));

/* 버튼 */
document.getElementById("zin").onclick=()=>map.zoomIn();
document.getElementById("zout").onclick=()=>map.zoomOut();
document.getElementById("zfit").onclick=()=>{const p=fitPadding();map.flyToBounds(ERAS[cur].bounds,{paddingTopLeft:p[0],paddingBottomRight:p[1],duration:.6})};
const pb=document.getElementById("powerBtn");
pb.onclick=()=>{powerOn=!powerOn; powerOn?map.addLayer(powerLayer):map.removeLayer(powerLayer);
  pb.classList.toggle("off",!powerOn); pb.setAttribute("aria-pressed",String(powerOn));
  document.getElementById("ecLegend").style.display=powerOn?"":"none";};
const card=document.getElementById("eraCard");
document.getElementById("ecHead").onclick=()=>{card.classList.toggle("collapsed");document.getElementById("ecChev").textContent=card.classList.contains("collapsed")?"펼치기 ▴":"접기 ▾"};
if(window.innerWidth<520){card.classList.add("collapsed");document.getElementById("ecChev").textContent="펼치기 ▴";}

/* 시작: #divided 처럼 해시로 시대 지정 가능 */
const startId=(location.hash||"").replace("#","");
const startIdx=Math.max(0,ERAS.findIndex(e=>e.id===startId));
drawEra(startId?startIdx:0,false);
window.addEventListener("hashchange",()=>{const k=ERAS.findIndex(e=>"#"+e.id===location.hash);if(k>=0&&k!==cur)drawEra(k,true)});
</script>
</body>
</html>
