<!DOCTYPE html>
  <html lang="ko">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>성경 66권 시대적 배경 총정리</title>
  <style>
    :root{
      --olive:#6b7a4f; --moss:#556b3d; --gold:#c9a24b; --gold-light:#e8cf8a;
      --beige:#f5efe0; --ivory:#fbf8f0; --brown:#5a4633; --ink:#3a3226;
      --ot-color:#8a6a3e; --nt-color:#3f6b5a;
}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
        font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    background: linear-gradient(180deg, var(--ivory) 0%, var(--beige) 100%);
    color:var(--ink);
    line-height:1.6;
    padding-bottom:60px;
}
  header{
        background: linear-gradient(135deg, #3a3226 0%, #5a4633 40%, #8a6a3e 75%, var(--gold) 100%);
    color:var(--ivory);
    padding:56px 24px 40px;
    text-align:center;
    position:relative;
    overflow:hidden;
}
  header::after{
        content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 70% 20%, rgba(255,220,150,0.25), transparent 60%);
}
  header h1{
    font-size:2.1rem; font-weight:800; letter-spacing:-0.5px; position:relative;
}
  header p{
        margin-top:12px; font-size:1rem; color:#e9dcc0; position:relative;
      max-width:640px; margin-left:auto; margin-right:auto;
}
  .meta-note{
        margin-top:18px; font-size:0.8rem; color:#cbb98a; position:relative;
  }

  .controls{
        position:sticky; top:0; z-index:20;
    background:rgba(251,248,240,0.96);
    backdrop-filter:blur(6px);
        border-bottom:1px solid #e4d8bc;
    padding:16px 20px;
}
  .controls-inner{max-width:1100px; margin:0 auto;}
  .search-row{display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
      #searchInput{
    flex:1; min-width:200px; padding:10px 16px; border-radius:999px;
    border:1px solid #d9c79a; font-size:0.95rem; outline:none; background:#fff;
}
  #searchInput:focus{border-color:var(--gold);}
        .testament-toggle{display:flex; gap:8px;}
  .testament-toggle button{
        padding:10px 18px; border-radius:999px; border:1px solid #d9c79a;
    background:#fff; cursor:pointer; font-weight:700; font-size:0.9rem; color:var(--brown);
    transition:all .15s;
}
      .testament-toggle button.active{background:var(--brown); color:#fff; border-color:var(--brown);}

  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    padding:6px 14px; border-radius:999px; font-size:0.82rem; cursor:pointer;
          border:1px solid #ddcfa8; background:#fff; color:var(--brown); white-space:nowrap;
    transition:all .15s;
}
  .chip.active{background:var(--gold); border-color:var(--gold); color:#3a3226; font-weight:700;}
  .result-count{font-size:0.8rem; color:#8a7a5a; margin-top:10px;}

    main{max-width:1100px; margin:0 auto; padding:28px 20px;}
  .grid{
    display:grid;
        grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:18px;
}
      .card{
    background:#fff;
    border:1px solid #ecdfc0;
    border-radius:16px;
    padding:20px 22px;
        box-shadow:0 2px 10px rgba(90,70,50,0.06);
    transition:transform .15s, box-shadow .15s;
    display:flex; flex-direction:column; gap:10px;
      }
  .card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(90,70,50,0.12);}
      .card-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .card-num{font-size:0.75rem; color:#b3a37c; font-weight:700;}
  .badge{
    font-size:0.7rem; padding:3px 10px; border-radius:999px; font-weight:700;
    color:#fff; white-space:nowrap;
  }
    .badge.ot{background:var(--ot-color);}
        .badge.nt{background:var(--nt-color);}
      .card h3{font-size:1.25rem; color:var(--brown); font-weight:800;}
  .card .cat{font-size:0.78rem; color:var(--gold); font-weight:700;}
  .info-row{display:flex; gap:8px; font-size:0.83rem; color:#7a6a4e;}
  .info-row b{color:var(--ink); font-weight:700; min-width:64px; display:inline-block;}
  .section-label{
    font-size:0.78rem; font-weight:800; color:var(--olive);
    margin-top:4px; border-top:1px dashed #e6dab8; padding-top:8px;
      }
  .section-text{font-size:0.88rem; color:#4a4030;}
  .note{font-size:0.78rem; color:#9c8a5f; font-style:italic; margin-top:2px;}

  footer{
        text-align:center; padding:32px 20px 10px; font-size:0.78rem; color:#a89568;
  }
  .no-result{
        text-align:center; padding:60px 20px; color:#a89568; font-size:0.95rem;
  }
  @media (max-width:600px){
    header h1{font-size:1.5rem;}
    .card-num{display:none;}
      }

  .figure-list{display:flex; flex-direction:column; gap:6px;}
  .figure-item{
    background:#faf5e6; border:1px solid #eee0bf; border-radius:10px;
    padding:8px 10px; font-size:0.82rem;
  }
  .figure-name{font-weight:800; color:var(--brown); margin-right:4px;}
  .figure-meaning{color:#5c4f38;}

    .route-map{margin-top:6px; border-radius:10px; overflow:hidden; border:1px solid #eee0bf; cursor:zoom-in; position:relative;}
    .route-map:hover{border-color:#c9a227;}
    .route-map::after{content:"🔍 크게 보기"; position:absolute; bottom:6px; right:8px; background:rgba(255,255,255,0.85); font-size:10px; padding:2px 6px; border-radius:6px; color:#7a5c1e; font-weight:700;}
    .route-svg{display:block; width:100%; height:auto; min-height:200px;}
    .map-modal-overlay{display:none; position:fixed; inset:0; background:rgba(20,15,5,0.72); z-index:1000; align-items:center; justify-content:center; padding:24px;}
    .map-modal-overlay.active{display:flex;}
    .map-modal-box{background:#fffaf0; border-radius:14px; padding:18px; max-width:min(900px,92vw); max-height:90vh; overflow:auto; box-shadow:0 10px 40px rgba(0,0,0,0.4);}
    .map-modal-box svg{width:100%; height:auto; display:block; min-width:600px;}
    .map-modal-close{text-align:right; cursor:pointer; font-weight:700; color:#7a5c1e; margin-bottom:8px;}
    </style>
      </head>
      <body>

      <header>
        <h1>📖 성경 66권, 그 시대 속으로</h1>
        <p>창세기부터 요한계시록까지 — 각 권이 쓰인 시대적 배경, 저자, 기록 목적을 한눈에 정리했습니다.</p>
        <div class="meta-note">저작 연대와 저자는 전통적 견해를 기본으로 하며, 학계에서 이견이 있는 경우 별도로 표기했습니다.</div>
      </header>

      <div class="controls">
        <div class="controls-inner">
          <div class="search-row">
            <input id="searchInput" type="text" placeholder="책 이름으로 검색 (예: 로마서, 다니엘...)">
            <div class="testament-toggle">
              <button class="active" data-t="all">전체 66권</button>
              <button data-t="구약">구약 39권</button>
              <button data-t="신약">신약 27권</button>
            </div>
          </div>
          <div class="chip-row" id="chipRow"></div>
          <div class="result-count" id="resultCount"></div>
        </div>
      </div>

      <main>
        <div class="grid" id="grid"></div>
        <div class="no-result" id="noResult" style="display:none;">검색 결과가 없습니다.</div>
      </main>

      <footer>성경 66권 시대적 배경 총정리 · 전통적 견해를 기본으로 작성된 참고 자료입니다. <span style="opacity:.65">현대 지도 이미지: Strebe, CC BY-SA 3.0 (Wikimedia Commons)</span></footer>

function routeViewBox(pts){
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  let minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  let w = maxX-minX, h = maxY-minY;
  const padX = Math.max(w*0.28, 45), padY = Math.max(h*0.28, 45);
  minX -= padX; maxX += padX; minY -= padY; maxY += padY;
  w = maxX-minX; h = maxY-minY;
  const ratio = 1.5;
  if (w/h > ratio) { const nh = w/ratio; const cy=(minY+maxY)/2; minY=cy-nh/2; maxY=cy+nh/2; h=nh; }
  else { const nw = h*ratio; const cx=(minX+maxX)/2; minX=cx-nw/2; maxX=cx+nw/2; w=nw; }
  return [minX, minY, w, h];
}

function renderRouteMapSVG(route){
  if (!route || route.length < 2) return "";
  const pts = route.map(k => ROUTE_LOC[k]).filter(Boolean);
  if (pts.length < 2) return "";
  const vb = routeViewBox(pts);
  const poly = pts.map(p => p[0]+","+p[1]).join(" ");
  const dots = route.map((k,i) => {
    const p = ROUTE_LOC[k]; if(!p) return "";
    const isFirst = i===0, isLast = i===route.length-1;
    const r = isFirst||isLast ? 7 : 5;
    const fill = isFirst ? "#2e7d32" : (isLast ? "#c62828" : "#b8860b");
    const labelY = p[1] - 11;
    return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+r+'" fill="'+fill+'" stroke="#fff" stroke-width="1.5"/>'
      + routeLabel(p[0], labelY, k, 13, "#3a2e18", true)
      + (isFirst ? routeLabel(p[0], p[1]+18, "▶ 출발지", 10, "#1a6b2e", true) : "")
      + (isLast ? routeLabel(p[0], p[1]+18, "■ 도착지", 10, "#a11d1d", true) : "");
  }).join("");
  return '<svg viewBox="'+vb[0]+' '+vb[1]+' '+vb[2]+' '+vb[3]+'" class="route-svg" xmlns="http://www.w3.org/2000/svg">'
    + routeBg()
    + '<polyline points="'+poly+'" fill="none" stroke="#a0522d" stroke-width="3" stroke-dasharray="7,5"/>'
    + dots
    + '</svg>';
}

  if (!route || route.length < 2) return "";
  const pts = route.map(k => ROUTE_LOC_REAL[k]).filter(Boolean);
  if (pts.length < 2) return "";
  const vb = routeViewBox(pts);
  const poly = pts.map(p => p[0]+","+p[1]).join(" ");
  const dots = route.map((k,i) => {
    const p = ROUTE_LOC_REAL[k]; if(!p) return "";
    const isFirst = i===0, isLast = i===route.length-1;
    const r = isFirst||isLast ? 7 : 5;
    const fill = isFirst ? "#2e7d32" : (isLast ? "#c62828" : "#ffb300");
    const labelY = p[1] - 11;
    return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+r+'" fill="'+fill+'" stroke="#fff" stroke-width="1.8"/>'
      + routeLabel(p[0], labelY, k, 13, "#fff6dc", true)
      + (isFirst ? routeLabel(p[0], p[1]+18, "▶ 출발지", 10, "#eaffe0", true) : "")
      + (isLast ? routeLabel(p[0], p[1]+18, "■ 도착지", 10, "#ffe0e0", true) : "");
  }).join("");
  return '<svg viewBox="'+vb[0]+' '+vb[1]+' '+vb[2]+' '+vb[3]+'" class="route-svg" xmlns="http://www.w3.org/2000/svg">'
    + modernBg2()
    + '<polyline points="'+poly+'" fill="none" stroke="#ff3b1f" stroke-width="4" stroke-dasharray="9,6" stroke-linecap="round"/>'
    + dots
    + '</svg>';
}
function ensureMapModal(){
  if (document.getElementById('mapModalOverlay')) return;
  const overlay = document.createElement('div');
  overlay.id = 'mapModalOverlay';
  overlay.className = 'map-modal-overlay';
  overlay.innerHTML = '<div class="map-modal-box"><div class="map-modal-close">닫기 ✕</div><div id="mapModalContent"></div></div>';
  overlay.addEventListener('click', function(e){ if(e.target===overlay) closeMapModal(); });
  overlay.querySelector('.map-modal-close').addEventListener('click', closeMapModal);
  document.body.appendChild(overlay);
}
function openMapModal(el){
  ensureMapModal();
  document.getElementById('mapModalContent').innerHTML = el.innerHTML;
  document.getElementById('mapModalOverlay').classList.add('active');
}
function closeMapModal(){
  const o = document.getElementById('mapModalOverlay');
  if (o) o.classList.remove('active');
}


const CATS = ["전체","오경","역사서","시가서","대선지서","소선지서","복음서","바울서신","일반서신","예언서"];

let state = { testament:"all", cat:"전체", q:"" };

  function renderChips(){
  const row = document.getElementById("chipRow");
  row.innerHTML = "";
  CATS.forEach(c=>{
        const el = document.createElement("div");
        el.className = "chip" + (state.cat===c ? " active":"");
    el.textContent = c;
    el.onclick = ()=>{ state.cat=c; renderChips(); renderGrid(); };
    row.appendChild(el);
});
}

function renderGrid(){
    const grid = document.getElementById("grid");
  const noResult = document.getElementById("noResult");
  grid.innerHTML = "";
  const q = state.q.trim();
  const filtered = BOOKS.filter(b=>{
    if(state.testament!=="all" && b.t!==state.testament) return false;
    if(state.cat!=="전체" && b.cat!==state.cat) return false;
    if(q && !(b.name.includes(q) || (b.figures||[]).some(f=>f[0].includes(q)))) return false;
    return true;
});
  document.getElementById("resultCount").textContent = `${filtered.length}권 표시 중 (전체 66권)`;
  noResult.style.display = filtered.length ? "none" : "block";
  filtered.forEach(b=>{
        const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
            <div class="card-top">
              <span class="card-num">${String(b.n).padStart(2,"0")}</span>
              <span class="badge ${b.t==="구약"?"ot":"nt"}">${b.t}</span>
            </div>
            <h3>${b.name}</h3>
            <div class="cat">${b.cat}</div>
            <div class="info-row"><b>저자</b><span>${b.author}</span></div>
            <div class="info-row"><b>기록시기</b><span>${b.date}</span></div>
            <div class="section-label">시대적 배경</div>
            <div class="section-text">${b.bg}</div>
            <div class="section-label">기록 목적</div>
            <div class="section-text">${b.purpose}</div>
            ${b.figures ? `<div class="section-label">등장 인물</div><div class="figure-list">${b.figures.map(f=>`<div class="figure-item"><span class="figure-name">${f[0]}</span><span class="figure-meaning">${f[1]}</span></div>`).join("")}</div>` : ""}
            ${b.route ? `<div class="section-label">이동경로</div><div class="route-map" onclick="openMapModal(this)">${renderRouteMapSVG(b.route)}</div>` : ""}
            ${b.route ? `<div class="section-label">이동경로 (현재 지도 기준)</div><div class="route-map" onclick="openMapModal(this)">${renderRealMapSVG(b.route)}</div>` : ""}
            ${b.note ? `<div class="note">※ ${b.note}</div>` : ""}
    `;
    grid.appendChild(card);
});
}

document.querySelectorAll(".testament-toggle button").forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll(".testament-toggle button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    state.testament = btn.dataset.t;
    renderGrid();
};
});

document.getElementById("searchInput").addEventListener("input", (e)=>{
    state.q = e.target.value;
  renderGrid();
});

renderChips();
renderGrid();
</script>
