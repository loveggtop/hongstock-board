<!DOCTYPE html>
  <html lang="ko">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>성경 66권 시대적 배경 총정리</title>
  <style>
    :root{
      --olive:#6b7a4f; --moss:#556b3d; --gold:#c9a24b; --gold-light:#e8cf8a;
      --beige:#f5efe0; --ivory:#fbf8f0; --brown:#5a4633; --ink:#3a3226;
      --ot-color:#8a6a3e; --nt-color:#3f6b5a;
}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
        font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    background: linear-gradient(180deg, var(--ivory) 0%, var(--beige) 100%);
    color:var(--ink);
    line-height:1.6;
    padding-bottom:60px;
}
  header{
        background: linear-gradient(135deg, #3a3226 0%, #5a4633 40%, #8a6a3e 75%, var(--gold) 100%);
    color:var(--ivory);
    padding:56px 24px 40px;
    text-align:center;
    position:relative;
    overflow:hidden;
}
  header::after{
        content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 70% 20%, rgba(255,220,150,0.25), transparent 60%);
}
  header h1{
    font-size:2.1rem; font-weight:800; letter-spacing:-0.5px; position:relative;
}
  header p{
        margin-top:12px; font-size:1rem; color:#e9dcc0; position:relative;
      max-width:640px; margin-left:auto; margin-right:auto;
}
  .meta-note{
        margin-top:18px; font-size:0.8rem; color:#cbb98a; position:relative;
  }

  .controls{
        position:sticky; top:0; z-index:20;
    background:rgba(251,248,240,0.96);
    backdrop-filter:blur(6px);
        border-bottom:1px solid #e4d8bc;
    padding:16px 20px;
}
  .controls-inner{max-width:1100px; margin:0 auto;}
  .search-row{display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
      #searchInput{
    flex:1; min-width:200px; padding:10px 16px; border-radius:999px;
    border:1px solid #d9c79a; font-size:0.95rem; outline:none; background:#fff;
}
  #searchInput:focus{border-color:var(--gold);}
        .testament-toggle{display:flex; gap:8px;}
  .testament-toggle button{
        padding:10px 18px; border-radius:999px; border:1px solid #d9c79a;
    background:#fff; cursor:pointer; font-weight:700; font-size:0.9rem; color:var(--brown);
    transition:all .15s;
}
      .testament-toggle button.active{background:var(--brown); color:#fff; border-color:var(--brown);}

  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    padding:6px 14px; border-radius:999px; font-size:0.82rem; cursor:pointer;
          border:1px solid #ddcfa8; background:#fff; color:var(--brown); white-space:nowrap;
    transition:all .15s;
}
  .chip.active{background:var(--gold); border-color:var(--gold); color:#3a3226; font-weight:700;}
  .result-count{font-size:0.8rem; color:#8a7a5a; margin-top:10px;}

    main{max-width:1100px; margin:0 auto; padding:28px 20px;}
  .grid{
    display:grid;
        grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:18px;
}
      .card{
    background:#fff;
    border:1px solid #ecdfc0;
    border-radius:16px;
    padding:20px 22px;
        box-shadow:0 2px 10px rgba(90,70,50,0.06);
    transition:transform .15s, box-shadow .15s;
    display:flex; flex-direction:column; gap:10px;
      }
  .card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(90,70,50,0.12);}
      .card-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .card-num{font-size:0.75rem; color:#b3a37c; font-weight:700;}
  .badge{
    font-size:0.7rem; padding:3px 10px; border-radius:999px; font-weight:700;
    color:#fff; white-space:nowrap;
  }
    .badge.ot{background:var(--ot-color);}
        .badge.nt{background:var(--nt-color);}
      .card h3{font-size:1.25rem; color:var(--brown); font-weight:800;}
  .card .cat{font-size:0.78rem; color:var(--gold); font-weight:700;}
  .info-row{display:flex; gap:8px; font-size:0.83rem; color:#7a6a4e;}
  .info-row b{color:var(--ink); font-weight:700; min-width:64px; display:inline-block;}
  .section-label{
    font-size:0.78rem; font-weight:800; color:var(--olive);
    margin-top:4px; border-top:1px dashed #e6dab8; padding-top:8px;
      }
  .section-text{font-size:0.88rem; color:#4a4030;}
  .note{font-size:0.78rem; color:#9c8a5f; font-style:italic; margin-top:2px;}

  .deepdive-links{display:flex; flex-direction:column; gap:6px; margin-top:2px;}
  .deepdive-link{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:7px 12px; border:1px solid var(--gold); border-radius:9px;
    background:#fbf3df; color:var(--brown); font-weight:700; font-size:0.83rem;
    text-decoration:none; transition:background .15s, transform .15s;
  }
  .deepdive-link:hover{background:var(--gold-light); transform:translateX(2px);}
  .deepdive-link::after{content:"→"; opacity:.7;}

  footer{
        text-align:center; padding:32px 20px 10px; font-size:0.78rem; color:#a89568;
  }
  .no-result{
        text-align:center; padding:60px 20px; color:#a89568; font-size:0.95rem;
  }
  @media (max-width:600px){
    header h1{font-size:1.5rem;}
    .card-num{display:none;}
      }

  .figure-list{display:flex; flex-direction:column; gap:6px;}
  .figure-item{
    background:#faf5e6; border:1px solid #eee0bf; border-radius:10px;
    padding:8px 10px; font-size:0.82rem;
    cursor:pointer; position:relative; transition:all .15s;
  }
  .figure-item:hover{background:#f5ead0; border-color:var(--gold); transform:translateX(2px);}
  .figure-name{font-weight:800; color:var(--brown); margin-right:4px;}
  .figure-name::after{content:" 📖"; font-size:0.72em; opacity:0.6;}
  .figure-meaning{color:#5c4f38;}

  .figure-modal-overlay{display:none; position:fixed; inset:0; background:rgba(20,15,5,0.72); z-index:1100; align-items:center; justify-content:center; padding:20px;}
  .figure-modal-overlay.active{display:flex;}
  .figure-modal-box{background:#fffaf0; border-radius:16px; padding:26px 28px; max-width:min(680px,92vw); max-height:86vh; overflow-y:auto; box-shadow:0 12px 44px rgba(0,0,0,0.42);}
  .figure-modal-close{text-align:right; cursor:pointer; font-weight:700; color:#7a5c1e; margin-bottom:10px; font-size:0.9rem;}
  .figure-modal-title{font-size:1.5rem; font-weight:800; color:var(--brown); margin-bottom:6px;}
  .figure-modal-ref{font-size:0.85rem; color:var(--gold); font-weight:700; margin-bottom:14px;}
  .figure-modal-summary{
    font-size:0.9rem; color:#5c4f38; background:#f5ead0; border-radius:10px;
    padding:10px 14px; margin-bottom:16px; font-style:italic; border-left:3px solid var(--gold);
  }
  .figure-modal-story p{font-size:0.95rem; color:#4a4030; line-height:1.85; margin-bottom:14px;}
  .figure-modal-story p:last-child{margin-bottom:0;}
  @media (max-width:600px){
    .figure-modal-box{padding:20px 18px;}
    .figure-modal-title{font-size:1.25rem;}
  }

    .route-map{margin-top:6px; border-radius:10px; overflow:hidden; border:1px solid #eee0bf; cursor:zoom-in; position:relative;}
    .route-map:hover{border-color:#c9a227;}
    .route-map::after{content:"🔍 크게 보기"; position:absolute; bottom:6px; right:8px; background:rgba(255,255,255,0.85); font-size:10px; padding:2px 6px; border-radius:6px; color:#7a5c1e; font-weight:700;}
    .route-svg{display:block; width:100%; height:auto; min-height:200px;}
    .map-modal-overlay{display:none; position:fixed; inset:0; background:rgba(20,15,5,0.72); z-index:1000; align-items:center; justify-content:center; padding:24px;}
    .map-modal-overlay.active{display:flex;}
    .map-modal-box{background:#fffaf0; border-radius:14px; padding:18px; max-width:min(900px,92vw); max-height:90vh; overflow:auto; box-shadow:0 10px 40px rgba(0,0,0,0.4);}
    .map-modal-box svg{width:100%; height:auto; display:block; min-width:600px;}
    .map-modal-close{text-align:right; cursor:pointer; font-weight:700; color:#7a5c1e; margin-bottom:8px;}
    </style>
      </head>
      <body>

      <header>
        <h1>📖 성경 66권, 그 시대 속으로</h1>
        <p>창세기부터 요한계시록까지 — 각 권이 쓰인 시대적 배경, 저자, 기록 목적을 한눈에 정리했습니다.</p>
        <div class="meta-note">저작 연대와 저자는 전통적 견해를 기본으로 하며, 학계에서 이견이 있는 경우 별도로 표기했습니다.</div>
      </header>

      <div class="controls">
        <div class="controls-inner">
          <div class="search-row">
            <input id="searchInput" type="text" placeholder="책 이름으로 검색 (예: 로마서, 다니엘...)">
            <div class="testament-toggle">
              <button class="active" data-t="all">전체 66권</button>
              <button data-t="구약">구약 39권</button>
              <button data-t="신약">신약 27권</button>
            </div>
          </div>
          <div class="chip-row" id="chipRow"></div>
          <div class="result-count" id="resultCount"></div>
        </div>
      </div>

      <main>
        <div class="grid" id="grid"></div>
        <div class="no-result" id="noResult" style="display:none;">검색 결과가 없습니다.</div>
      </main>

      <footer>성경 66권 시대적 배경 총정리 · 전통적 견해를 기본으로 작성된 참고 자료입니다. <span style="opacity:.65">현대 지도 이미지: Strebe, CC BY-SA 3.0 (Wikimedia Commons)</span></footer>

"아담과 하와": {
  ref: "창세기 1장~5장",
  story: `하나님은 엿새째 되는 날 자신의 형상을 따라 아담을 흙으로 지으시고 생기를 불어넣어 생령이 되게 하셨습니다. 이어 아담의 갈빗대로 하와를 만드시고 두 사람을 에덴동산에 두어 그곳을 경작하고 지키게 하셨습니다. 동산 중앙에는 선악을 알게 하는 나무가 있었고, 하나님은 그 열매만은 먹지 말라고 명하셨습니다.

그러나 뱀(사탄)이 하와를 유혹했고, 하와와 아담은 하나님처럼 되고자 하는 욕심에 그 열매를 먹고 맙니다. 그 순간 그들의 눈이 밝아져 자신들의 벌거벗음을 부끄러워하게 되었고, 하나님과의 관계는 두려움과 숨음으로 깨어졌습니다. 하나님은 뱀에게는 저주를, 하와에게는 해산의 고통을, 아담에게는 땀 흘려 일해야 하는 수고를 선고하셨지만, 동시에 뱀의 후손과 여자의 후손 사이의 싸움에서 결국 여자의 후손이 뱀의 머리를 상하게 할 것이라는 '원시복음'(창 3:15)을 약속하셨습니다.

에덴에서 쫓겨난 두 사람은 가죽옷을 입혀주신 하나님의 은혜 가운데 새 삶을 시작했고, 가인과 아벨, 이후 셋을 낳아 인류의 조상이 됩니다. 아담과 하와의 이야기는 인간이 지음받은 존엄과, 불순종으로 인한 죄와 죽음의 시작, 그리고 그 안에서도 포기하지 않으시는 하나님의 구속 계획의 출발점을 보여줍니다.`
},

노아는 사람들의 조롱 속에서도 오랜 시간 순종하며 방주를 지었고, 마침내 큰 비가 40일간 내려 온 땅이 물에 잠겼습니다. 물이 빠진 뒤 노아는 방주에서 나와 제단을 쌓아 하나님께 제사를 드렸고, 하나님은 다시는 물로 세상을 멸하지 않으시겠다는 언약의 증표로 무지개를 하늘에 두셨습니다(창 9:13).

노아의 이야기는 죄에 대한 하나님의 엄중한 심판과 동시에, 믿음으로 순종하는 자를 구원하시는 은혜를 함께 보여줍니다. 신약에서도 노아는 믿음의 본보기(히 11:7)이자, 홍수가 장차 있을 심판의 예표로 언급됩니다(마 24:37-39, 벧전 3:20).`

"아브라함": {

  story: `아브람(훗날 아브라함)은 갈대아 우르에서 하란을 거쳐, 하나님의 부르심을 따라 정든 땅과 친척을 떠나 알지 못하는 땅 가나안으로 향합니다. 하나님은 그에게 "내가 너로 큰 민족을 이루고... 땅의 모든 족속이 너로 말미암아 복을 얻을 것"이라 약속하셨습니다(창 12:2-3). 이 부르심에 대한 순종 하나로 아브라함은 성경 전체에서 '믿음의 조상'으로 불리게 됩니다.

그의 삶은 완벽하지 않았습니다. 기근을 피해 애굽에 내려가 아내 사래를 누이라 속이기도 했고, 자녀를 주시겠다는 약속을 기다리다 못해 여종 하갈을 통해 이스마엘을 얻기도 했습니다. 그러나 하나님은 99세의 아브라함에게 이름을 아브라함(열국의 아비)으로 바꿔주시며 언약을 재확인하셨고, 100세에 마침내 약속의 아들 이삭이 태어납니다.

아브라함 신앙의 정점은 모리아산에서 이삭을 번제로 바치라는 명령에 순종하려 했던 사건입니다(창 22장). 그는 "하나님이 자기 아들을 아끼지 아니하시고" 준비하실 것을 믿었고, 하나님은 마지막 순간 숫양으로 대신하게 하시며 그의 믿음을 확증하셨습니다. 이 사건은 훗날 하나님이 자기 아들을 내어주시는 구속 사역의 예표로 이해됩니다. 아브라함은 로마서와 갈라디아서에서 '믿음으로 의롭다 함을 얻는' 복음의 원형으로 제시됩니다.`
},

"야곱(이스라엘)": {
  ref: "창세기 25장~50장",
  story: `이삭과 리브가의 둘째 아들 야곱은 태어날 때부터 형 에서의 발꿈치를 잡고 나왔고, 훗날 팥죽 한 그릇으로 장자권을, 아버지를 속여 장자의 축복을 가로챕니다. 형의 분노를 피해 외삼촌 라반의 집으로 도망가던 중, 벧엘에서 하늘에 닿은 사닥다리 환상을 보고 하나님의 언약을 재확인받습니다.

라반의 집에서 20년을 보내며 레아와 라헬을 아내로 얻고 열두 아들과 딸 디나를 낳습니다. 고향으로 돌아오는 길, 얍복강 나루에서 밤새 하나님(의 사자)과 씨름하며 "당신이 나를 축복하지 아니하면 가게 하지 아니하겠나이다"라고 매달렸고, 그 결과 환도뼈가 위골되면서도 '이스라엘'(하나님과 겨루어 이김)이라는 새 이름을 받습니다(창 32:28).

야곱의 삶은 형 에서와의 화해, 사랑하는 아들 요셉을 잃은 슬픔, 그리고 노년에 애굽에서 요셉과 재회하는 감격으로 이어집니다. 그의 열두 아들은 훗날 이스라엘 열두 지파의 조상이 되며, 야곱은 죽기 전 각 아들을 축복하며 유다 지파에서 왕권이 나올 것을 예언합니다(창 49:10). 그는 인간적 결점이 많은 인물이었지만, 하나님은 그를 붙드시고 다듬어 언약 백성의 조상으로 세우셨습니다.`
},

"요셉": {
  ref: "창세기 37장, 39장~50장",
  story: `야곱이 노년에 얻은 아들 요셉은 아버지의 편애와 꿈 이야기로 형들의 미움을 사, 결국 형들에 의해 애굽으로 팔려갑니다. 보디발의 집에서 성실히 일하다 누명을 쓰고 감옥에 갇히지만, 그곳에서도 신실함을 잃지 않았고, 바로의 꿈을 해석해준 것을 계기로 애굽의 총리 자리에까지 오르게 됩니다.

요셉은 7년의 풍년 동안 곡식을 비축해 뒤이은 7년의 흉년에 대비했고, 이 지혜로 애굽과 주변 나라들을 기근에서 구합니다. 양식을 구하러 온 형들과 마침내 재회한 요셉은 자신의 정체를 밝히며 눈물로 그들을 용서합니다. "당신들은 나를 해하려 하였으나 하나님은 그것을 선으로 바꾸사... 오늘과 같이 많은 백성의 생명을 구원하게 하시려 하셨나니"(창 50:20)라는 고백은 성경 전체를 관통하는 섭리 신앙의 대표적 선언으로 꼽힙니다.

요셉으로 인해 야곱의 온 가족은 애굽 고센 땅에 정착하게 되고, 이는 훗날 출애굽 사건의 배경이 됩니다. 요셉은 억울한 고난 속에서도 하나님을 향한 신실함을 지켰고, 원한을 은혜로 갚은 용서와 화해의 모범으로 성경 전체에서 손꼽히는 인물입니다.`
},

"모세": {
  ref: "출애굽기~신명기",
  story: `히브리 남아 학살령 속에서 나일강 갈대상자에 담겨 살아남은 모세는 바로의 딸의 손에서 자랐지만, 동족을 위해 애굽인을 죽인 뒤 미디안 광야로 도망쳐 40년간 양을 치며 지냅니다. 80세가 되던 해, 호렙산 떨기나무 불꽃 가운데 나타나신 하나님은 "나는 스스로 있는 자"(여호와)라는 이름을 알려주시며 그를 이스라엘의 구원자로 부르십니다(출 3장).

모세는 아론과 함께 바로 앞에 서서 열 가지 재앙을 통해 이스라엘 백성을 애굽에서 이끌어냅니다. 홍해를 육지처럼 건너는 기적, 시내산에서 십계명과 율법을 받는 언약 체결, 성막 건축까지, 모세는 이스라엘이 '하나님의 백성'으로 세워지는 모든 과정의 중심에 있습니다. 그러나 백성의 끝없는 불평과 반역, 금송아지 사건 등 광야 40년은 순탄치 않았고, 모세 자신도 므리바에서 반석을 두 번 쳐 명령에 불순종함으로 약속의 땅에 들어가지 못하는 벌을 받습니다(민 20장).

모압 평지에서 신명기의 고별 설교를 마친 모세는 느보산에서 가나안 땅을 눈으로 바라본 뒤 세상을 떠납니다. 그는 "여호와께서 대면하여 아신 자"(신 34:10)로 평가되며, 율법의 수여자이자 중보자로서 신약에서 그리스도의 예표로 자주 언급됩니다(행 3:22, 히 3장).`
},

"아론": {
  ref: "출애굽기 4장, 28~29장, 32장",
  story: `모세의 형 아론은 말에 능하지 못한 모세를 대신해 바로 앞에서 대언자 역할을 감당했고, 이스라엘의 첫 대제사장으로 세워져 제사장 직분의 시작을 상징하는 인물이 됩니다. 그러나 모세가 시내산에 오래 머무는 동안 백성의 압박에 못 이겨 금송아지를 만들어 우상숭배를 이끈 실패도 함께 겪습니다(출 32장).

이후 아론과 그 자손은 제사장 옷을 입고 성막에서 제사를 주관하는 직분을 세습받았고, 아론의 지팡이가 싹이 나는 사건(민 17장)을 통해 그의 제사장직이 하나님께로부터 온 것임이 재확인됩니다. 아론의 삶은 은혜로 세워진 직분자라도 실패할 수 있음과, 동시에 하나님이 세우신 직분의 신실함을 함께 보여줍니다. 히브리서는 아론의 제사장직을 그리스도의 영원한 대제사장직과 대조해 설명합니다.`
},

"바로": {
  ref: "출애굽기 5장~14장",
  story: `애굽의 왕 바로는 이스라엘 백성이 번성하는 것을 두려워해 남아 학살령을 내렸던 압제자였고, 모세와 아론이 백성을 보내라고 요청했을 때도 완악하게 거부합니다. 하나님은 열 가지 재앙을 통해 애굽의 신들을 심판하시며 바로의 마음을 다루셨는데, 성경은 바로가 스스로 마음을 완악하게 했을 뿐 아니라 하나님이 그 마음을 완악하게 하셨다고도 기록합니다(출 9:12).

마지막 재앙인 장자의 죽음 이후에야 바로는 이스라엘을 보내주지만, 곧 마음을 돌이켜 병거를 이끌고 뒤쫓다가 홍해에서 군대 전체가 수장되는 파국을 맞습니다. 바로는 하나님께 맞서는 세상 권력의 완악함과 그 끝을 대표하는 인물로, 이스라엘의 구원 이야기 속에서 하나님의 절대 주권을 극적으로 드러내는 배경 역할을 합니다.`
},

"아론과 그 아들들": {
  ref: "레위기 8장~10장",
  story: `레위기는 아론과 그의 네 아들(나답, 아비후, 엘르아살, 이다말)이 제사장으로 위임되는 장면으로 시작됩니다. 모세는 하나님의 지시에 따라 이들에게 특별한 옷을 입히고 기름을 부어 거룩하게 구별했고, 이들은 이스라엘을 대신해 하나님께 제사를 드리는 직분을 맡게 됩니다.

그러나 위임식 직후, 나답과 아비후가 명하지 않은 '다른 불'을 하나님께 드리다가 즉시 심판을 받아 죽는 사건이 벌어집니다(레 10장). 이는 거룩하신 하나님을 섬기는 일이 인간의 임의적 방식이 아니라 하나님이 정하신 방식을 따라야 함을 엄중히 보여줍니다. 이후 엘르아살과 이다말의 계보를 통해 제사장 직분이 대대로 이어지며, 이스라엘 예배의 근간을 이루게 됩니다.`
},

"여호수아와 갈렙": {
  ref: "민수기 13장~14장",
  story: `가나안 정탐을 위해 열두 지파에서 한 명씩 보낸 열두 명의 정탐꾼 중, 열 명은 가나안 주민이 강대하다는 이유로 부정적인 보고를 해 백성을 두려움에 빠뜨렸습니다. 그러나 여호수아와 갈렙만은 "그 땅은 심히 아름다운 땅이라... 여호와께서 우리와 함께 하시느니라 그들을 두려워하지 말라"며 믿음의 보고를 합니다(민 14:7-9).

백성이 이 두 사람을 돌로 치려 할 만큼 거세게 반발했지만, 하나님은 오직 여호수아와 갈렙만이 그 세대 중 약속의 땅에 들어가게 될 것이라 선언하십니다. 나머지 불신앙의 세대는 40년간 광야를 떠돌다 죽게 됩니다. 두 사람은 다수의 두려움에 휩쓸리지 않고 하나님의 약속을 붙든 믿음의 표본으로, 이후 실제로 가나안 정복 세대를 이끄는 지도자가 됩니다.`
},

"발람": {
  ref: "민수기 22장~24장",
  story: `이스라엘이 모압 평지에 이르자, 모압 왕 발락은 이방 선지자 발람을 불러 이스라엘을 저주해달라고 요청합니다. 발람은 처음엔 하나님의 뜻을 따라 거절하지만, 거듭된 청탁과 재물의 유혹에 결국 발락에게로 향합니다. 가는 길에 그가 탄 나귀가 천사를 보고 세 번이나 멈춰서고, 급기야 사람처럼 말을 하는 기이한 사건이 벌어져 발람을 꾸짖습니다(민 22:28).

발락 앞에 선 발람은 이스라엘을 저주하려 할 때마다 입을 열 수 없었고, 오히려 하나님이 주시는 대로 이스라엘을 축복하는 신탁을 네 차례에 걸쳐 선포합니다. "야곱에서 한 별이 나오며 이스라엘에서 한 규가 일어나서"(민 24:17)라는 예언은 훗날 메시아 예언으로도 이해됩니다. 발람은 결국 하나님의 뜻을 거스르지 못한 채, 이방 선지자였음에도 하나님의 도구로 쓰인 역설적 인물로 남습니다. 다만 이후 이스라엘이 모압 여인들과 음행하게 만든 배후로도 지목되어(민 31:16), 탐욕에 이끌린 거짓 선지자의 대명사로 신약에서도 경계의 대상으로 언급됩니다(벧후 2:15, 계 2:14).`
},

"여호수아": {
  ref: "여호수아 1장~24장",
  story: `모세의 시종으로 오랜 세월 훈련받은 여호수아는 모세가 죽은 뒤 이스라엘의 지도자로 세워집니다. 하나님은 그에게 "강하고 담대하라... 내가 너와 함께 있느니라"고 반복해 격려하시며(수 1:9) 가나안 정복의 사명을 맡기십니다.

여호수아는 요단강을 마른 땅처럼 건너고, 난공불락으로 여겨지던 여리고성을 하나님의 명하신 방식(제사장의 나팔과 백성의 함성)으로 무너뜨립니다. 아이성 전투의 실패와 재도전, 기브온과의 조약, 남부와 북부 연합군과의 전투를 거치며 가나안 땅을 정복해 열두 지파에게 분배합니다. 노년에 이른 여호수아는 세겜에서 백성을 모아 "오직 나와 내 집은 여호와를 섬기겠노라"는 유명한 고별사를 남기며 언약 갱신을 이끕니다(수 24:15).

여호수아는 모세의 후계자로서 순종과 담대한 실행력을 겸비한 지도자상을 대표하며, 그의 이름(여호수아, '여호와는 구원이시다')은 신약의 '예수'와 같은 어원을 갖고 있어 자주 예수 그리스도의 예표로 이해됩니다.`
},

"라합": {
  ref: "여호수아 2장, 6장",
  story: `여리고성의 기생이었던 라합은 이스라엘이 보낸 두 정탐꾼을 자신의 집 지붕 위 삼대 속에 숨겨 목숨을 구해줍니다. 그녀는 "여호와께서 너희에게 이 땅을 주신 줄을 내가 아노라... 여호와는 위로 하늘에서도, 아래로 땅에서도 하나님이시니라"(수 2:9-11)라는 신앙 고백을 하며, 이방인이면서도 이스라엘의 하나님을 인정합니다.

정탐꾼들은 여리고 함락 때 그녀와 가족을 살려주기로 약속했고, 창문에 붉은 줄을 매어 표시함으로 라합의 온 가족은 성이 무너질 때 유일하게 살아남습니다. 이후 라합은 이스라엘 공동체에 편입되어 살몬과 결혼했고, 그 아들 보아스를 통해 다윗, 나아가 예수 그리스도의 족보에까지 이름을 올리게 됩니다(마 1:5). 라합은 신분과 과거에 상관없이 믿음으로 하나님께 응답한 자가 받아들여진다는 은혜의 대표적 사례로, 히브리서 11장 믿음의 인물 목록과 야고보서에서도 행함 있는 믿음의 예로 언급됩니다.`
},

"드보라": {
  ref: "사사기 4장~5장",
  story: `가나안 왕 야빈과 그의 군대장관 시스라의 압제 아래 20년을 신음하던 이스라엘 시대, 드보라는 여선지자이자 사사로서 종려나무 아래에서 백성의 재판을 담당하고 있었습니다. 그녀는 바락을 불러 하나님의 명령을 전하며 시스라의 군대와 싸우라고 촉구하지만, 바락은 드보라가 함께 가지 않으면 나가지 않겠다고 합니다.

드보라는 그와 함께 다볼산으로 올라가고, 이스라엘 군대는 기손강 전투에서 시스라의 철병거 군대를 물리칩니다. 도망친 시스라는 겐 사람 헤벨의 아내 야엘의 장막에 숨었다가, 야엘이 장막 말뚝으로 그를 죽임으로써 최후를 맞습니다. 드보라와 바락은 승리 후 "드보라의 노래"(삿 5장)를 불러 하나님께 영광을 돌립니다. 드보라는 사사 시대의 혼란 속에서 여성 지도자로서 영적 분별력과 담대함으로 이스라엘을 이끈 독특한 인물입니다.`
},

"기드온": {
  ref: "사사기 6장~8장",
  story: `미디안의 침략으로 극심한 압제를 겪던 시절, 기드온은 포도주 틀에 숨어 밀을 타작하다가 하나님의 사자로부터 "큰 용사여 여호와께서 너와 함께 계시도다"라는 부름을 받습니다. 스스로 "내 집은 므낫세 중에 극히 약하고 나는 내 아버지 집에서 제일 작은 자"라며 주저했지만(삿 6:15), 하나님은 양털 표징으로 그의 믿음을 확증시켜 주십니다.

기드온은 아버지의 바알 제단을 헐어 신앙의 결단을 보였고, 하나님은 그의 군대를 3만 2천에서 300명으로 줄이셔서 승리가 사람의 힘이 아닌 하나님께 있음을 드러내십니다. 항아리 속 횃불과 나팔, 함성만으로 미디안 진영을 혼란에 빠뜨려 대승을 거둔 이 전투는 성경에서 가장 극적인 승리 이야기 중 하나로 꼽힙니다. 이후 백성이 그를 왕으로 삼으려 하자 "내가 너희를 다스리지 아니하겠고... 여호와께서 너희를 다스리시리라"며 거절한 대목은 사사 시대 신정 원리를 잘 보여줍니다. 다만 말년에 에봇을 만들어 온 집안이 우상숭배에 빠지게 하는 오점도 남깁니다.`
},

"삼손": {
  ref: "사사기 13장~16장",
  story: `삼손은 태어나기 전부터 나실인으로 구별되어, 포도주를 마시지 않고 머리에 삭도를 대지 않겠다는 서원 아래 큰 힘을 부여받은 사사입니다. 그는 맨손으로 사자를 찢고, 블레셋 사람 천 명을 나귀 턱뼈로 물리치는 등 초인적인 힘으로 이스라엘을 억압하던 블레셋에 맞섰습니다.

그러나 삼손의 삶은 이방 여인들에 대한 절제 없는 애정으로 얼룩집니다. 들릴라의 거듭된 유혹과 회유에 결국 자신의 힘의 비밀(머리카락)을 털어놓고, 잠든 사이 머리가 깎여 힘을 잃은 채 블레셋에 붙잡혀 두 눈까지 뽑히는 비참한 처지가 됩니다. 그러나 다곤 신전에서 조롱거리가 되던 마지막 순간, 삼손은 다시 힘을 주시길 기도하며 신전 기둥을 무너뜨려 자신과 함께 블레셋 지도자들을 몰살시킵니다. 삼손은 큰 은사를 받았음에도 절제 없는 삶으로 스스로 무너진, 은혜와 인간적 연약함이 극명하게 대조되는 인물입니다.`
},

"룻": {
  ref: "룻기 1장~4장",
  story: `사사시대 기근을 피해 모압으로 이주했던 나오미의 가정은 남편과 두 아들을 잃는 참담한 상실을 겪습니다. 며느리인 모압 여인 룻은 시어머니 나오미가 고향 베들레헴으로 돌아가려 하자, "어머니의 백성이 나의 백성이 되고 어머니의 하나님이 나의 하나님이 되시리니"(룻 1:16)라는 유명한 고백과 함께 끝까지 동행하기로 결단합니다.

베들레헴에서 룻은 이삭을 주우며 생계를 이었고, 나오미의 친족인 보아스의 밭에서 일하다 그의 은혜를 입습니다. 나오미의 인도로 룻은 보아스에게 기업 무를 자로서의 책임을 요청했고, 보아스는 율법의 절차를 신실하게 따라 룻을 아내로 맞아들입니다. 두 사람 사이에서 오벳이 태어나고, 오벳은 다윗 왕의 할아버지가 됩니다(룻 4:17). 이방 여인이었던 룻이 헌신적 신앙과 인애로 다윗과 궁극적으로 예수 그리스도의 족보(마 1:5)에까지 편입된 이 이야기는, 하나님의 구원 계획이 이스라엘을 넘어 모든 민족에게 열려 있음을 보여줍니다.`
},

"나오미": {
  ref: "룻기 1장~4장",
  story: `베들레헴 출신인 나오미는 기근을 피해 남편 엘리멜렉, 두 아들과 함께 모압으로 이주했지만, 그곳에서 남편과 두 아들을 모두 잃는 깊은 상실을 겪습니다. 스스로를 "즐거움"이라는 뜻의 나오미 대신 "마라"(쓰다)로 불러 달라 할 만큼 인생의 쓴맛을 토로했습니다(룻 1:20).

그러나 며느리 룻의 헌신적 동행과 함께 베들레헴으로 돌아온 나오미는, 친족 보아스와 룻을 연결해주는 지혜로운 인도자 역할을 감당합니다. 룻과 보아스 사이에서 태어난 오벳을 품에 안으며, 마을 여인들은 나오미에게 "그가 네 생명의 회복자이며 네 노년의 봉양자"라 축복합니다(룻 4:15). 나오미의 이야기는 상실과 고난 가운데서도 신실한 관계와 하나님의 섭리를 통해 회복에 이르는 과정을 보여줍니다.`
},

"보아스": {
  ref: "룻기 2장~4장",
  story: `베들레헴의 유력한 지주였던 보아스는 자기 밭에서 이삭을 줍던 룻에게 호의를 베풀어 안전하게 일할 수 있도록 배려하고, 일꾼들에게 일부러 곡식을 흘려두라고까지 지시합니다. 그는 이미 룻이 시어머니에게 보인 헌신에 대해 소문으로 들어 알고 있었습니다.

율법에는 죽은 친족의 대를 잇고 그 재산을 지켜주는 '기업 무를 자'(고엘) 제도가 있었는데, 보아스는 자신보다 더 가까운 친족이 권리를 포기하자 정식 절차를 밟아 룻을 아내로 맞고 엘리멜렉 가문의 기업을 무릅니다. 이 결혼으로 태어난 오벳은 다윗 왕의 할아버지가 됩니다. 보아스는 값을 치르고 곤경에 처한 자를 구속(救贖)해내는 인물로서, 훗날 값을 치르고 죄인을 구속하시는 그리스도의 사역을 예표하는 인물로 흔히 이해됩니다.`
},

"사무엘": {
  ref: "사무엘상 1장~25장",
  story: `한나가 오랜 불임 끝에 성전에서 간절히 기도하여 얻은 아들 사무엘은 젖을 뗀 후 실로 성막의 제사장 엘리에게 맡겨져 자랐습니다. 어린 사무엘은 밤중에 자신을 부르는 하나님의 음성을 듣고 "여호와여 말씀하옵소서 주의 종이 듣겠나이다"라고 응답하며 선지자로 세워집니다(삼상 3:9-10).

엘리의 두 아들이 타락하여 하나님의 심판을 받은 후, 사무엘은 이스라엘의 마지막 사사이자 선지자로서 백성을 이끕니다. 백성이 다른 나라들처럼 왕을 요구하자 사무엘은 그 위험성을 경고하면서도 하나님의 뜻에 따라 사울에게 기름을 부어 첫 왕으로 세웁니다. 그러나 사울이 불순종하자, 사무엘은 다시 베들레헴 이새의 집으로 가서 막내아들 다윗에게 기름을 부어 다음 왕으로 예비합니다(삼상 16장). 사무엘은 신정에서 왕정으로 넘어가는 이스라엘 역사의 전환점에서 하나님의 뜻을 신실하게 전달한 마지막 사사이자 선지자로 평가받습니다.`
},

"사울": {
  ref: "사무엘상 9장~31장",
  story: `베냐민 지파 출신의 준수한 청년 사울은 잃어버린 아버지의 나귀를 찾아다니다 사무엘을 만나 뜻밖에 이스라엘의 첫 왕으로 기름부음을 받습니다. 초기에는 암몬과의 전쟁에서 승리하며 백성의 지지를 얻지만, 점차 하나님의 명령보다 자신의 판단을 앞세우는 모습을 보입니다.

블레셋과의 전투를 앞두고 사무엘을 기다리지 못해 스스로 제사를 드린 일, 아말렉을 진멸하라는 명령을 어기고 좋은 것들을 남겨둔 일로 인해 사무엘은 "순종이 제사보다 낫다"고 책망하며 사울의 왕위가 다른 사람에게 넘어갈 것을 선언합니다(삼상 15:22). 이후 사울은 하나님의 영이 떠나고 악한 영에 시달리며, 자신을 대신할 다윗을 향한 시기와 살해 시도로 여생을 보냅니다. 결국 블레셋과의 마지막 전투인 길보아산 전투에서 아들들과 함께 전사하며 비극적으로 생을 마감합니다. 사울은 은혜로 시작했으나 불순종과 시기로 스스로 무너진, 실패한 왕의 전형으로 남습니다.`
},

"다윗": {
  ref: "사무엘상 16장~열왕기상 2장, 시편",
  story: `이새의 막내아들로 양을 치던 다윗은 사무엘에게 기름부음을 받은 후, 골리앗과의 싸움에서 물맷돌 하나로 거인을 쓰러뜨리며 이스라엘의 영웅으로 떠오릅니다. 사울의 시기와 살해 위협 속에 오랜 도피 생활을 하면서도, 사울을 죽일 기회가 여러 번 있었음에도 "여호와의 기름부음을 받은 자"를 해하지 않는 신앙적 절제를 보입니다.

사울이 죽은 후 다윗은 온 이스라엘의 왕이 되어 예루살렘을 정복해 수도로 삼고, 통일왕국의 전성기를 엽니다. 하나님은 다윗에게 "네 집과 네 나라가... 영원히 보전되고 네 왕위가 영원히 견고하리라"는 영원한 왕조 언약을 맺어주십니다(삼하 7:16). 그러나 다윗도 큰 실패를 겪는데, 부하 우리아의 아내 밧세바를 범하고 그를 죽음으로 몰아넣은 사건이 대표적입니다. 선지자 나단의 책망(삼하 12장) 앞에 다윗은 즉시 회개했고, 그 참회는 시편 51편에 절절히 담겨 있습니다.

다윗은 가장 많은 시편을 남긴 예배자이자 시인으로, 정직한 신앙 고백의 모델로 평가받습니다. "하나님 마음에 합한 자"(행 13:22)로 불리는 그는 완전한 왕은 아니었지만, 실패 앞에서 정직하게 회개하는 신앙의 본을 보였고, 그의 왕조는 훗날 오실 메시아('다윗의 자손')에 대한 소망의 근거가 됩니다.`
},

"나단": {
  ref: "사무엘하 7장, 12장",
  story: `다윗 시대의 선지자 나단은 다윗이 성전을 짓고자 했을 때, 처음엔 좋게 여겼다가 하나님의 계시를 받아 오히려 하나님이 다윗의 집을 영원히 세우실 것이라는 다윗 언약을 전달합니다(삼하 7장). 이는 성경 전체에서 메시아 소망의 신학적 기초가 되는 중요한 순간입니다.

그러나 나단의 가장 극적인 순간은 다윗이 밧세바를 범하고 우리아를 죽게 한 뒤 찾아온 장면입니다. 그는 부자와 가난한 자의 양 비유를 통해 다윗의 죄를 스스로 깨닫게 한 뒤 "당신이 그 사람이라"고 단호히 지적합니다(삼하 12:7). 왕 앞에서도 굽히지 않고 죄를 직언한 나단의 용기는, 권력자에게도 진실을 말해야 하는 선지자적 사명의 전형을 보여줍니다.`
},

"솔로몬": {
  ref: "열왕기상 1장~11장, 잠언, 전도서, 아가",
  story: `다윗과 밧세바 사이에서 태어난 솔로몬은 형 아도니야의 왕위 찬탈 시도를 물리치고 왕위에 오릅니다. 기브온에서 하나님이 무엇을 원하느냐 물으실 때, 그는 부와 장수 대신 "듣는 마음"을 구했고, 하나님은 그 지혜뿐 아니라 부귀와 영광까지 더해주셨습니다(왕상 3:9-13).

솔로몬은 7년에 걸쳐 예루살렘 성전을 건축해 언약궤를 안치하고, 이스라엘 역사상 최고의 번영과 국제적 명성(스바 여왕의 방문 등)을 이룹니다. 그의 지혜는 잠언에, 인생의 헛됨에 대한 성찰은 전도서에, 사랑 노래는 아가에 담겨 전해집니다. 그러나 말년에 이르러 많은 이방 아내들을 두면서 그들의 신을 따라 우상을 섬기게 되고, 이로 인해 하나님의 진노를 사 나라가 분열될 것이라는 심판을 예고받습니다(왕상 11장). 솔로몬은 지혜와 성전 건축의 전성기를 이루었지만, 마음이 하나님에게서 떠나면 아무리 큰 지혜와 부도 소용없다는 것을 보여주는 반면교사이기도 합니다.`
},

"엘리야": {
  ref: "열왕기상 17장~열왕기하 2장",
  story: `아합 왕과 이세벨이 바알 숭배를 국가적으로 조장하던 북이스라엘의 가장 어두운 시기, 디셉 사람 엘리야는 홀연히 등장해 수년간의 가뭄을 선포합니다. 그릿시냇가와 사르밧 과부의 집에서 까마귀와 기적의 가루통·기름병으로 보호받으며, 죽은 과부의 아들을 살리는 기적도 행합니다.

엘리야의 절정은 갈멜산 대결입니다. 바알 선지자 450명과 맞서 하늘에서 불을 내려달라 기도했고, 여호와께서 불을 내려 제단과 물까지 태우시자 백성은 "여호와 그는 하나님이시로다"라고 외치며 엎드립니다(왕상 18:39). 그러나 승리 직후 이세벨의 살해 위협에 낙심해 광야로 도망친 엘리야에게, 하나님은 세미한 음성으로 다가와 그를 다시 일으키시고 후계자 엘리사에게 기름을 부으라 명하십니다.

엘리야는 마지막에 죽음을 보지 않고 불수레와 불말을 타고 회오리바람에 하늘로 올라가는 특별한 방식으로 생을 마칩니다(왕하 2:11). 이 때문에 그는 장차 올 메시아의 선구자로 여겨졌고(말 4:5), 신약에서는 변화산에서 모세와 함께 예수님 곁에 나타나며(마 17:3), 세례 요한의 사역이 '엘리야의 심령과 능력으로' 온 것으로 이해됩니다(눅 1:17).`
},

"엘리사": {
  ref: "열왕기하 2장~13장",
  story: `엘리야의 뒤를 이은 엘리사는 스승이 승천할 때 "당신의 영감이 갑절이나 내게 있게 하소서"라고 구했고, 그 요청대로 엘리야보다 더 많은 기적을 행한 선지자로 기록됩니다. 그는 요단강을 가르고, 죽은 수넴 여인의 아들을 살리며, 독이 든 국을 정결케 하고, 적은 기름을 넘치게 하여 과부의 빚을 갚게 하는 등 일상 속 필요를 채우는 기적을 많이 행했습니다.

특히 아람의 군대장관 나아만이 문둥병을 고치기 위해 찾아왔을 때, 요단강에 일곱 번 몸을 씻으라는 단순한 명령으로 그를 치유해 이방인에게도 열린 하나님의 은혜를 보여줍니다(왕하 5장). 엘리사는 정치적 격변기에도 여러 왕들에게 조언하며 이스라엘을 위기에서 건져냈고, 그의 사역은 심판보다 회복과 자비의 성격이 두드러진다는 점에서 엘리야와 대조를 이룹니다.`
},

"히스기야": {
  ref: "열왕기하 18장~20장, 역대하 29장~32장",
  story: `유다 왕 히스기야는 우상숭배로 얼룩졌던 아버지 아하스의 시대를 마감하고 대대적인 종교개혁을 단행합니다. 성전을 정결케 하고 무너진 예배를 회복했으며, 심지어 모세가 만든 놋뱀조차 백성이 우상처럼 섬기자 부수어버릴 만큼 철저했습니다(왕하 18:4).

앗수르의 산헤립이 예루살렘을 포위하고 위협했을 때, 히스기야는 그 협박 편지를 성전에 펴놓고 기도했고, 선지자 이사야를 통해 하나님의 구원을 약속받습니다. 그날 밤 여호와의 사자가 앗수르 진영 18만 5천 명을 치심으로 예루살렘은 기적적으로 구원받습니다(왕하 19:35). 또한 병들어 죽게 되었을 때 간절히 기도하여 15년의 생명을 더 얻는 일도 겪지만, 이후 바벨론 사신들에게 왕궁의 보물을 자랑삼아 보여준 일로 훗날 바벨론 포로의 씨앗을 뿌리는 실수도 남깁니다. 히스기야는 앗수르의 침공 속에서도 신앙으로 나라를 지킨 개혁 왕으로 평가받습니다.`
},

"요시야": {
  ref: "열왕기하 22장~23장, 역대하 34장~35장",
  story: `여덟 살에 왕위에 오른 요시야는 할아버지 므낫세와 아버지 아몬의 극심한 우상숭배를 물려받은 상황에서도, 어린 나이부터 하나님을 찾기 시작해 유다 역사상 가장 철저한 종교개혁을 이끕니다. 성전 수리 도중 대제사장 힐기야가 '율법책'을 발견해 왕 앞에서 읽었을 때, 요시야는 옷을 찢으며 조상들의 불순종에 대해 통회했습니다(왕하 22:11).

그는 온 나라에서 우상의 산당과 아세라 목상, 바알 제단을 철저히 파괴하고, 오랫동안 지켜지지 않았던 유월절을 성대하게 회복시켰습니다. 성경은 "요시야와 같이 마음을 다하며 뜻을 다하며 힘을 다하여 모세의 모든 율법을 따라 여호와께로 돌이키고... 왕은 전무후무하니라"고 평가합니다(왕하 23:25). 그러나 애굽 왕 느고와의 전투에서 므깃도에서 전사함으로 생을 마감하며, 그의 죽음 이후 유다는 급속히 멸망의 길로 치닫습니다.`
},

"히스기야·요시야": {
  ref: "역대하 29장~35장",
  story: `역대기는 히스기야와 요시야 두 왕을 성전과 예배를 회복시킨 대표적인 개혁 군주로 나란히 조명합니다. 히스기야는 성전을 정결케 하고 유월절을 부활시켰으며, 요시야는 잃어버렸던 율법책을 되찾아 나라 전체의 신앙을 새롭게 했습니다. 두 왕 모두 선대의 우상숭배 잔재를 걷어내고 여호와 신앙의 순수성을 회복하려 힘썼다는 공통점이 있습니다.

포로에서 돌아온 귀환 공동체에게 역대기는 이 두 왕의 사례를 통해, 성전 중심의 신실한 예배 회복이야말로 공동체의 미래를 좌우하는 핵심임을 강조합니다. 두 왕의 개혁은 일시적으로 심판을 늦추었지만, 근본적인 국가적 죄악까지 되돌리지는 못해 결국 유다는 바벨론에 멸망하고 맙니다.`
},

"에스라": {
  ref: "에스라 7장~10장, 느헤미야 8장",
  story: `제사장이자 학사였던 에스라는 페르시아 아닥사스다 왕의 허락을 받아 두 번째 귀환 무리를 이끌고 바벨론에서 예루살렘으로 돌아옵니다. 그는 "여호와의 율법을 연구하여 준행하며 율례와 규례를 이스라엘에게 가르치기로 결심"한 인물로 소개됩니다(스 7:10).

예루살렘에 도착한 에스라는 귀환한 백성들이 이방 여인과 통혼하여 신앙의 순수성이 흔들리는 것을 보고 크게 통회하며 개혁을 이끕니다. 훗날 느헤미야와 함께 수문 앞 광장에 백성을 모아 율법책을 낭독했을 때, 백성들은 말씀을 들으며 울었고 이는 초막절 회복과 신앙 갱신으로 이어집니다(느 8장). 에스라는 귀환 공동체에 율법을 다시 가르쳐 신앙의 뿌리를 굳건히 세운 학사이자 지도자로 평가받습니다.`
},

"스룹바벨": {
  ref: "에스라 1장~6장, 학개, 스가랴",
  story: `다윗 왕조의 후손인 스룹바벨은 고레스 왕의 칙령에 따라 1차 귀환민을 이끌고 바벨론에서 예루살렘으로 돌아온 총독입니다. 그는 대제사장 여호수아와 함께 무너진 제단을 먼저 재건해 예배를 회복했고, 이어 성전의 기초를 놓았습니다.

그러나 주변 민족들의 방해와 백성의 낙심으로 성전 재건 공사는 16년간 중단되었고, 스룹바벨은 선지자 학개와 스가랴의 독려를 받아 마침내 공사를 재개해 성전을 완공합니다. 스가랴는 그에게 "이는 힘으로 되지 아니하며 능으로 되지 아니하고 오직 나의 영으로 되느니라"는 말씀을 전합니다(슥 4:6). 스룹바벨은 정치적 지도력으로 귀환 공동체의 성전 재건이라는 핵심 과업을 실행에 옮긴 인물로 기억됩니다.`
},

"느헤미야": {
  ref: "느헤미야 1장~13장",
  story: `페르시아 아닥사스다 왕의 술 관원으로 있던 느헤미야는 예루살렘 성벽이 무너지고 백성이 곤경에 처했다는 소식을 듣고 금식하며 기도합니다. 왕의 허락을 받아 예루살렘으로 가서 밤에 몰래 성벽을 둘러본 뒤, 백성들을 조직해 각자 자기 집 앞의 성벽을 맡아 재건하도록 지휘합니다.

산발랏과 도비야 등 주변 세력의 조롱과 방해, 심지어 암살 위협 속에서도 느헤미야는 한 손에 무기, 한 손에 연장을 들고 공사를 감독하며 놀랍게도 단 52일 만에 성벽을 완공합니다(느 6:15). 이후 에스라와 함께 백성에게 율법을 가르치고 언약을 갱신하며, 총독으로서 사회적 불의(고리대금업 등)를 바로잡는 개혁도 단행합니다. 느헤미야는 기도와 실행력을 겸비한 지도자로서, 위기 속에서도 공동체를 재건해내는 리더십의 모범으로 평가받습니다.`
},

"에스더": {
  ref: "에스더 1장~10장",
  story: `페르시아 제국에 남아 있던 유대인 고아 소녀 에스더는 사촌 오라비 모르드개의 손에 자랐고, 아하수에로 왕이 왕후 와스디를 폐한 뒤 열린 왕비 간택에서 뽑혀 왕후가 됩니다. 그러나 이 시기 왕의 총애를 받던 신하 하만은 모르드개가 자신에게 절하지 않는 것에 격분해, 제국 전역의 유대인을 몰살하려는 음모를 꾸밉니다.

모르드개의 간청에 에스더는 처음엔 부름받지 않고 왕 앞에 나가는 것이 죽음을 각오해야 하는 일임을 알고 주저하지만, "이 때를 위함이 아닌지 누가 알겠느냐"는 모르드개의 말에 "죽으면 죽으리이다"라는 각오로 왕 앞에 나아갑니다(에 4:14-16). 지혜롭게 두 차례의 잔치를 베풀어 하만의 음모를 폭로하고, 결국 하만은 자신이 모르드개를 처형하려 세운 나무에 자신이 달리게 됩니다. 유대인들은 몰살 위기에서 구원받았고, 이를 기념해 부림절이 제정됩니다. 에스더서는 하나님의 이름이 한 번도 직접 언급되지 않지만, 그 숨겨진 섭리와 보호가 전체 이야기를 관통하고 있습니다.`
},

"모르드개": {
  ref: "에스더 2장~10장",
  story: `사촌 동생 에스더를 딸처럼 길러낸 모르드개는 수산궁 문에서 일하다 왕을 암살하려는 음모를 우연히 알아내 왕의 생명을 구합니다. 그러나 하만에게 절하기를 거부해 그의 표적이 되고, 하만은 모르드개뿐 아니라 온 유대 민족을 멸하려는 계획까지 세웁니다.

모르드개는 에스더에게 왕 앞에 나아가 민족을 구해달라고 설득하며 "이 때를 위함이 아닌지 누가 알겠느냐"는 말로 그녀의 결단을 이끌어냅니다(에 4:14). 훗날 왕이 잠 못 이루던 밤 궁중 일기를 읽다가 모르드개가 자신을 구했던 일이 상급받지 못한 것을 알게 되면서, 오히려 하만이 모르드개를 예우하게 되는 극적인 반전이 일어납니다. 결국 모르드개는 하만을 대신해 총리의 자리에까지 오르며, 에스더를 신실하게 인도하고 지혜롭게 처신한 인물로 기억됩니다.`
},

"하만": {
  ref: "에스더 3장~7장",
  story: `아각 사람 하만은 아하수에로 왕의 총애를 받아 모든 신하 위에 높임을 받았지만, 유일하게 자신에게 절하지 않는 모르드개에게 분노해 그 한 사람이 아니라 제국 전역의 유대 민족 전체를 멸하려는 음모를 꾸밉니다. 그는 제비(부르)를 뽑아 학살의 날짜를 정하고 왕의 이름으로 조서를 내리게 합니다.

그러나 에스더가 베푼 잔치에서 자신의 음모가 드러나고, 정작 자신이 모르드개를 처형하려고 미리 세워둔 높은 나무에 스스로 매달리는 극적인 반전을 맞습니다(에 7:10). 하만은 개인적 자존심과 증오가 어떻게 파멸적인 결과로 이어지는지, 그리고 악한 자가 스스로 판 함정에 빠지는 인과응보를 보여주는 대표적 인물입니다.`
},

"욥": {
  ref: "욥기 1장~42장",
  story: `우스 땅에 살던 욥은 "그 사람은 순전하고 정직하여 하나님을 경외하며 악에서 떠난 자"로 소개되는 의인이었습니다(욥 1:1). 그러나 하나님과 사탄의 대화 가운데, 사탄은 욥이 복을 누리기 때문에 하나님을 경외하는 것뿐이라며 그의 신앙에 의문을 제기합니다. 하나님의 허락 아래 욥은 하루 사이에 모든 재산과 열 자녀를 잃고, 이어 온몸에 악창이 나는 극심한 고통까지 당합니다.

세 친구 엘리바스, 빌닷, 소발이 찾아와 그를 위로하려 하지만, 오히려 고난은 죄의 결과라며 그를 정죄하는 긴 논쟁으로 이어집니다. 욥은 자신의 무죄를 항변하면서도 하나님께 정직하게 탄식하고 질문을 쏟아냅니다. 마침내 하나님은 폭풍우 가운데 나타나 창조의 신비와 자신의 주권을 보이시며 욥의 이해를 넘어서는 지혜를 일깨우십니다. 욥은 "내가 주께 대하여 귀로 듣기만 하였사오나 이제는 눈으로 주를 뵈옵나이다"라고 고백하며 회개하고(욥 42:5-6), 하나님은 이후 그의 소유를 갑절로 회복시켜 주십니다. 욥기는 까닭 없는 고난 속에서도 하나님을 향한 신뢰를 지켜낸 신앙, 그리고 인간이 다 이해할 수 없는 하나님의 주권을 다룹니다.`
},

"세 친구(엘리바스·빌닷·소발)": {
  ref: "욥기 4장~31장",
  story: `욥이 재앙을 당했다는 소식을 듣고 위로하러 온 엘리바스, 빌닷, 소발 세 친구는 처음 이레 동안은 말없이 그와 함께 슬퍼했지만, 곧 긴 논쟁을 벌이기 시작합니다. 이들의 공통된 논리는 "고난은 곧 죄의 결과"라는 단순한 인과응보 신학으로, 욥이 겪는 고통이 그가 숨긴 죄 때문이라고 거듭 몰아붙입니다.

세 친구는 저마다 다른 방식으로 이 주장을 반복하지만, 결국 욥의 실제 상황을 설명하지 못한 채 그를 정죄하는 데 그칩니다. 욥기 결말에서 하나님은 이들에게 진노하시며 "너희가 나를 가리켜 옳게 말하지 못했다"고 책망하시고, 욥에게 그들을 위해 중보 기도하게 하십니다(욥 42:7-8). 세 친구는 고난을 죄의 결과로만 단정하는 단순화된 신정론의 한계를 보여주는 대표적 사례로 남습니다.`
},

"전도자(솔로몬)": {
  ref: "전도서 1장~12장",
  story: `전도서의 화자 '전도자'(코헬렛)는 전통적으로 솔로몬으로 이해되며, "다윗의 아들 예루살렘 왕"으로 자신을 소개합니다(전 1:1). 그는 지혜와 쾌락, 부와 권력, 큰 사업과 많은 소유 등 인간이 누릴 수 있는 모든 것을 다 시도해 보았다고 고백합니다.

그러나 그 모든 것 끝에 이른 결론은 "해 아래서 하는 모든 수고가 헛되도다"라는 통렬한 성찰입니다(전 2:11). 전도자는 인생의 반복성과 죽음 앞의 평등함, 지혜조차도 궁극적 답을 주지 못하는 한계를 직시하면서도, 냉소나 허무주의에 머물지 않고 "너는 청년의 때에 너의 창조주를 기억하라"(전 12:1), "하나님을 경외하고 그 명령을 지킬지어다 이것이 사람의 본분이니라"(전 12:13)는 결론에 이릅니다. 모든 것을 다 가져본 뒤에야 헛됨을 깨닫고 하나님께로 돌아오는 구도자의 모습을 보여줍니다.`
},

"신랑(솔로몬으로 이해됨)": {
  ref: "아가 1장~8장",
  story: `아가서는 신랑과 신부가 서로를 향한 사랑을 노래하는 시가로, 신랑은 전통적으로 솔로몬으로 이해됩니다. 신랑은 신부의 아름다움을 시적이고 열정적인 언어로 찬미하며, "내 누이, 내 신부야 네가 내 마음을 빼앗았구나"(아 4:9)라고 고백할 만큼 깊고 헌신적인 사랑을 표현합니다.

두 사람의 사랑 노래는 노골적이지 않으면서도 인간의 사랑과 결혼이 지닌 아름다움과 친밀함을 긍정적으로 묘사합니다. 전통적으로 유대교와 기독교 해석 전통 모두에서 이 신랑과 신부의 관계는 각각 하나님과 이스라엘, 그리스도와 교회 사이의 언약적 사랑을 상징하는 것으로도 오랫동안 읽혀왔습니다.`
},

"술람미 여인(신부)": {
  ref: "아가 1장~8장",
  story: `아가서의 신부인 술람미 여인은 신랑의 사랑에 열정적으로 응답하는 인물로 그려집니다. "나는 사론의 수선화요 골짜기의 백합화로다"(아 2:1)라며 자신을 소박하게 묘사하지만, 신랑의 눈에는 더할 나위 없이 아름다운 존재로 비칩니다.

그녀는 신랑을 찾아 헤매기도 하고("내 마음으로 사랑하는 자를 내가 찾았노라", 아 3:4), 사랑의 강렬함을 "사랑은 죽음같이 강하고... 많은 물도 이 사랑을 끄지 못하겠고"(아 8:6-7)라는 유명한 구절로 노래합니다. 술람미 여인은 응답하는 사랑의 주체로서, 전통적으로 신랑의 사랑을 받아 응답하는 교회 공동체를 상징하는 것으로도 해석되어 왔습니다.`
},

"이사야": {
  ref: "이사야 1장~66장",
  story: `웃시야 왕이 죽던 해, 이사야는 성전에서 높이 들린 보좌에 앉으신 하나님과 스랍들의 "거룩하다 거룩하다 거룩하다"는 찬양을 보고 듣는 압도적인 소명 체험을 합니다. 자신의 부정함을 통감한 그에게 스랍이 제단의 숯불로 입술을 정결케 했고, "내가 누구를 보내며 누가 우리를 위하여 갈꼬"라는 하나님의 물음에 "내가 여기 있나이다 나를 보내소서"라고 응답하며 선지자로 부름받습니다(사 6장).

이사야는 앗수르의 위협 속에서 유다의 왕들(특히 히스기야)에게 정치적 동맹이 아닌 하나님을 신뢰하라고 담대히 권면했고, 임박한 심판을 경고하는 동시에 그 너머의 회복도 함께 선포했습니다. 무엇보다 그는 "처녀가 잉태하여 아들을 낳을 것이요 그 이름을 임마누엘이라 하리라"(사 7:14)는 예언과, 고난받는 종이 "그가 찔림은 우리의 허물 때문이요"(사 53:5)라며 우리를 대신해 고난당할 것이라는 예언으로 유명합니다. 이러한 예언들은 신약에서 예수 그리스도를 통해 성취된 것으로 이해되며, 이사야는 '구약의 복음서'로 불릴 만큼 메시아 예언이 풍성한 선지자입니다.`
},

"예레미야": {
  ref: "예레미야 1장~52장, 예레미야애가",
  story: `요시야 왕 13년, 아직 소년에 가까웠던 예레미야는 "내가 너를 모태에 짓기 전에 너를 알았고... 너를 여러 나라의 선지자로 세웠노라"는 부르심을 받습니다(렘 1:5). 그는 남유다가 멸망을 향해 치닫던 마지막 40여 년, 요시야의 개혁부터 예루살렘 함락까지의 격동기를 살아냈습니다.

예레미야는 백성과 지도자들에게 임박한 바벨론의 침공과 심판을 경고했지만, 거짓 선지자들과 왕실로부터 배신자 취급을 받아 매질과 감옥, 구덩이에 갇히는 등 극심한 박해를 겪습니다. 그럼에도 끝까지 회개를 촉구하며 하나님의 말씀을 굽히지 않았고, 예루살렘의 멸망을 눈앞에서 목격한 뒤 그 참상을 애가로 남깁니다. 동시에 그는 "내가 이스라엘 집과 유다 집에 새 언약을 맺으리라... 내 법을 그들의 마음에 기록하리라"(렘 31:31-33)는 새 언약에 대한 소망도 예언했는데, 이는 신약에서 그리스도를 통해 성취되는 언약으로 이해됩니다. '눈물의 선지자'로 불리는 예레미야는 외면받으면서도 끝까지 사명을 감당한 신실함의 대표적 인물입니다.`
},

"바룩": {
  ref: "예레미야 36장, 45장",
  story: `예레미야의 서기관이었던 바룩은 선지자가 구술하는 하나님의 말씀을 두루마리에 받아 적는 중요한 역할을 감당했습니다. 예레미야가 성전 출입이 금지되었을 때, 바룩은 대신 성전에 가서 그 두루마리를 백성 앞에서 낭독했습니다(렘 36장).

여호야김 왕은 그 두루마리를 조각조각 잘라 화로에 태워버렸지만, 예레미야와 바룩은 다시 두루마리를 만들어 말씀을 기록했습니다. 바룩 자신도 낙심하고 지쳤던 순간이 있었는데, 하나님은 그에게 개인적으로 위로와 보호의 말씀을 주십니다(렘 45장). 바룩은 위험을 무릅쓰고 선지자의 말씀을 후대에 전달한 신실한 동역자로 기억됩니다.`
},

"에스겔": {
  ref: "에스겔 1장~48장",
  story: `제사장 가문 출신의 에스겔은 여호야긴 왕과 함께 바벨론에 포로로 끌려간 인물로, 그발강 가에서 하늘이 열리며 네 생물과 바퀴, 하나님의 영광을 보는 압도적인 환상을 통해 선지자로 부름받습니다(겔 1장). 그는 예루살렘이 함락되기 전, 아직 남아 있는 성전과 도성에 대한 헛된 믿음을 버리라고 포로 공동체에 경고했습니다.

에스겔은 벽에 그림을 그리거나, 한쪽으로 오래 누워있거나, 아내가 죽어도 슬퍼하지 않는 등 파격적인 상징 행동으로 메시지를 전한 독특한 선지자였습니다. 예루살렘 멸망 이후에는 메시지의 초점이 심판에서 회복으로 옮겨가, 마른 뼈들이 살아나 큰 군대가 되는 환상(겔 37장)으로 이스라엘의 부활을 예언하고, 웅장한 새 성전에 대한 환상(겔 40~48장)으로 회복의 소망을 제시합니다. 그의 예언은 정당한 심판의 선포와 동시에, 하나님이 결코 자기 백성을 버리지 않으신다는 확신을 함께 담고 있습니다.`
},

"다니엘": {
  ref: "다니엘 1장~12장",
  story: `소년 시절 바벨론에 포로로 끌려간 다니엘은 왕궁에서 훈련받으면서도 왕의 진미와 포도주로 자신을 더럽히지 않겠다고 결심해 채식으로 시험을 통과하며 신앙의 절개를 지킵니다. 그는 느부갓네살 왕의 꿈(신상 환상)을 해석해 총리급 지위에 오르고, 이후에도 여러 왕을 섬기며 흔들리지 않는 지혜자로 인정받습니다.

다니엘의 삶에서 가장 유명한 사건은 다리오 왕 시대, 하루 세 번 예루살렘을 향해 기도하는 관습을 금지하는 조서에도 굴하지 않고 계속 기도하다 사자굴에 던져진 일입니다. 하나님은 사자의 입을 봉하셔서 그를 지켜주셨고, 이 사건은 이방 궁정에서도 신앙을 지킬 수 있다는 확신을 보여주는 대표적 이야기가 되었습니다. 다니엘서 후반부는 인자 같은 이의 환상(단 7장)과 종말에 관한 여러 계시를 담고 있어, 성경에서 대표적인 묵시문학으로 꼽히며 신약 요한계시록과도 깊이 연결됩니다.`
},

"사드락·메삭·아벳느고": {
  ref: "다니엘 1장, 3장",
  story: `다니엘의 세 친구인 하나냐, 미사엘, 아사랴는 바벨론식 이름인 사드락, 메삭, 아벳느고로 불리며 다니엘과 함께 궁정에서 훈련받았습니다. 이들은 다니엘과 마찬가지로 왕의 음식으로 자신을 더럽히지 않기로 결단한 신앙의 동지들이었습니다.

느부갓네살 왕이 금 신상을 세우고 모든 백성에게 절할 것을 명령했을 때, 세 사람은 오직 하나님만 경배하겠다며 이를 거부합니다. 왕이 극렬히 타는 풀무불에 던지겠다고 위협하자, 이들은 "하나님이 우리를 건져내시겠지만, 그렇지 않을지라도 우리는 왕의 신들을 섬기지도 절하지도 아니할 줄을 아옵소서"라는 흔들리지 않는 신앙을 고백합니다(단 3:17-18). 실제로 불 속에 던져졌지만 넷째 사람(하나님의 사자)과 함께 불 가운데를 걸으며 머리카락 하나 그을리지 않고 살아나왔고, 이를 본 느부갓네살은 하나님을 찬양하게 됩니다. 이들은 목숨을 건 상황에서도 신앙을 굽히지 않은 담대함의 대표적 상징입니다.`
},

"호세아": {
  ref: "호세아 1장~14장",
  story: `북이스라엘 말기, 경제적으로는 번영했지만 우상숭배와 도덕적 타락이 극에 달했던 시기에 활동한 호세아는 하나님의 명령에 따라 음란한 여인 고멜과 결혼합니다. 이는 신실하지 못한 이스라엘을 향한 하나님의 마음을 몸소 보여주기 위한 상징적 행동이었습니다.

고멜은 결혼 후에도 다른 남자에게로 떠나가지만, 하나님은 호세아에게 다시 그녀를 값을 주고 데려와 사랑하라고 명하십니다(호 3장). 이 개인적 고통을 통해 호세아는 이스라엘이 우상을 좇아 하나님을 배반했음에도, 하나님이 그들을 끝까지 포기하지 않으시고 다시 품으시는 끈질긴 언약적 사랑(헤세드)을 선포합니다. "내가 그들의 반역을 고치고 성심으로 사랑하리니 나의 진노가 그에게서 떠났음이니라"(호 14:4)는 말씀은 호세아서 전체의 핵심을 요약합니다.`
},

"고멜": {
  ref: "호세아 1장~3장",
  story: `호세아의 아내가 된 고멜은 '음란한 여인'으로 소개되며, 결혼 이후에도 신실하지 못한 삶을 이어가다 결국 다른 남자에게로 떠나갑니다. 이는 호세아 개인의 이야기이자, 동시에 하나님을 떠나 우상을 좇은 이스라엘을 상징하는 예언적 장치입니다.

하나님은 호세아에게 고멜을 노예 시장에서 값을 치르고 다시 데려오라 명하시고, 호세아는 그 명령에 순종해 신실하지 못한 아내를 다시 사랑으로 품습니다. 고멜의 이야기는 인간의 배신에도 불구하고 끝까지 돌이켜 사랑하시는 하나님의 언약적 헌신을 극적으로 형상화한 것으로, 신실하지 못한 이스라엘(그리고 모든 죄인)을 상징하는 인물로 이해됩니다.`
},

"요엘": {
  ref: "요엘 1장~3장",
  story: `선지자 요엘은 극심한 메뚜기 재앙이 온 땅의 곡식과 포도나무를 휩쓸어버린 재난 상황에서 활동합니다. 그는 이 자연재해를 단순한 사건이 아니라 다가올 더 큰 심판, 곧 '여호와의 날'의 예표로 해석하며 백성에게 "옷을 찢지 말고 마음을 찢고 너희 하나님 여호와께로 돌아올지어다"라고 회개를 촉구합니다(욜 2:13).

요엘은 재난을 영적 회개의 기회로 전환시키며, 동시에 회개하는 백성에게 회복의 소망도 전합니다. 특히 "그 후에 내가 내 영을 만민에게 부어 주리니"(욜 2:28)라는 예언은 신약 사도행전 오순절 성령강림 사건에서 베드로에 의해 직접 인용되며 그 성취로 선포됩니다(행 2:16-21).`
},

"아모스": {
  ref: "아모스 1장~9장",
  story: `유다 드고아 출신의 목자였던 아모스는 선지자 집안 출신이 아니었음에도, 북이스라엘이 여로보암 2세 치하에서 경제적 번영을 누리던 시기에 부름받아 사마리아로 파송됩니다. 그는 겉으로 화려한 예배와 제사가 계속되는 이면에, 부자들이 가난한 자를 짓밟고 재판이 뇌물로 왜곡되는 극심한 사회적 불의를 날카롭게 고발합니다.

아모스는 "너희 절기를 미워하며 멸시하며... 오직 정의를 물같이, 공의를 마르지 않는 강같이 흐르게 할지어다"(암 5:21-24)라며, 예배 형식보다 정의와 공의를 요구하시는 하나님의 마음을 선포했습니다. 비제도권 선지자로서 담대히 기득권을 비판한 그의 메시지는 이후에도 사회 정의를 강조하는 예언 전통의 대표적 목소리로 평가받습니다.`
},

"오바댜": {
  ref: "오바댜 1장",
  story: `구약에서 가장 짧은 책인 오바댜서를 기록한 선지자 오바댜는, 유다가 바벨론에 멸망할 때 형제 민족인 에돔(에서의 후손)이 오히려 침략자들을 도와 유다 백성을 약탈하고 도망자들을 넘겨준 배신을 배경으로 활동합니다.

오바댜는 "네가 형제의 날 곧 그 재앙의 날에 방관할 것이 아니었거늘"(옵 1:12)이라며 에돔의 배신을 강하게 고발하고, 그 교만과 잔인함에 대한 하나님의 심판을 선포합니다. 동시에 여호와의 날에 시온산에서 구원이 있을 것과 나라가 여호와께 속할 것이라는 소망도 함께 전합니다. 그는 형제 민족의 배신 앞에서 하나님의 공의가 반드시 이루어짐을 선포한 선지자로 기억됩니다.`
},

"요나": {
  ref: "요나 1장~4장",
  story: `여로보암 2세 시대에 활동한 것으로 알려진 요나는, 이스라엘의 오랜 적국이었던 앗수르의 수도 니느웨로 가서 심판을 선포하라는 명령을 받습니다. 그러나 원수 나라가 회개해 구원받는 것을 원치 않았던 요나는 정반대 방향인 다시스로 도망치는 배를 탑니다.

바다에서 큰 폭풍을 만나자 요나는 자신 때문임을 알고 바다에 던져지기를 자청했고, 큰 물고기가 그를 삼켜 사흘 밤낮을 뱃속에서 지내며 회개의 기도를 드립니다. 물고기가 그를 육지에 토해낸 뒤, 요나는 다시 니느웨로 가 심판의 메시지를 전했고, 뜻밖에도 왕부터 백성까지 굵은 베옷을 입고 신속하게 회개합니다. 하나님이 니느웨를 용서하시자 요나는 오히려 화를 내며 죽기를 구했고, 하나님은 박넝쿨 비유를 통해 "네가 수고도 아니하였고 재배도 아니하였고... 어찌 내가 이 큰 성읍 니느웨를 아끼지 아니하겠느냐"며 이방인을 향한 긍휼을 일깨우십니다(욘 4:10-11). 요나서는 이스라엘을 넘어 모든 민족을 향한 하나님의 선교적 마음을 보여주는 독특한 책입니다.`
},

"니느웨 왕과 백성": {
  ref: "요나 3장",
  story: `앗수르의 수도 니느웨는 이스라엘에게 두려움과 증오의 대상이었던 강대한 이방 제국의 심장부였습니다. 요나가 "사십 일이 지나면 니느웨가 무너지리라"는 단 한 마디 경고를 전했을 때, 놀랍게도 니느웨 왕은 왕좌에서 일어나 조복을 벗고 굵은 베옷을 입고 재 가운데 앉았으며, 온 성읍에 금식과 회개를 명령합니다.

왕은 "각기 악한 길과 손의 강포함에서 떠날 것이라... 하나님이 뜻을 돌이키시고 진노를 그치사 우리로 멸망하지 않게 하시리라"며 사람은 물론 가축에게까지 금식을 명할 만큼 철저히 회개했습니다(욘 3:8-9). 결국 하나님은 그들의 행위를 보시고 뜻을 돌이켜 재앙을 내리지 않으셨습니다. 니느웨 왕과 백성의 신속한 회개는 이스라엘 백성의 완악함과 대조되며, 이방인도 하나님의 말씀 앞에 진심으로 응답할 수 있음을 보여주는 사례입니다.`
},

"미가": {
  ref: "미가 1장~7장",
  story: `이사야와 동시대에 활동한 미가는 예루살렘 궁정이 아닌 시골 모레셋 출신으로, 남유다 지도층의 부패와 앗수르의 위협이 겹친 시기에 사역했습니다. 그는 지도자들이 백성의 뼈를 발라 가마에 넣는 것처럼 착취한다고 신랄하게 고발하며, 힘 있는 자들의 불의를 두려움 없이 비판했습니다.

미가는 심판을 경고하면서도 "여호와께서 네게 구하시는 것은 오직 정의를 행하며 인자를 사랑하며 겸손하게 네 하나님과 함께 행하는 것"(미 6:8)이라는 유명한 말씀으로 참된 신앙의 본질을 제시합니다. 무엇보다 그는 "베들레헴 에브라다야... 이스라엘을 다스릴 자가 네게서 내게로 나올 것"(미 5:2)이라 예언해, 메시아의 탄생지를 정확히 지목한 선지자로 유명합니다. 이 예언은 신약에서 예수님의 탄생 배경으로 직접 인용됩니다(마 2:6).`
},

"나훔": {
  ref: "나훔 1장~3장",
  story: `엘고스 사람 나훔은 한때 요나의 선포로 회개했던 니느웨가 다시 폭정을 일삼는 잔인한 제국의 수도로 돌아간 상황에서 활동합니다. 그는 오랫동안 앗수르에게 압제받아온 이스라엘과 주변 민족들을 대신해, 니느웨의 임박한 멸망을 생생하고 강렬한 시적 언어로 선포합니다.

나훔은 "여호와는 노하기를 더디 하시며 권능이 크시며 죄인을 결코 사면하지 아니하시느니라"(나 1:3)라며 하나님의 오래 참으심과 동시에 확실한 공의를 함께 선포합니다. 실제로 니느웨는 주전 612년 바벨론과 메대 연합군에 의해 멸망하는데, 나훔의 예언은 압제자에게도 반드시 심판이 임한다는 사실을 통해 억눌린 백성에게 큰 위로를 주었습니다.`
},

"하박국": {
  ref: "하박국 1장~3장",
  story: `바벨론이 급부상하던 시기에 활동한 하박국은 다른 선지자들과 달리 백성이 아닌 하나님께 직접 질문을 던지는 독특한 방식으로 예언서를 시작합니다. 그는 유다 내부의 불의가 왜 심판받지 않는지 묻고, 하나님이 그보다 더 악한 바벨론을 심판의 도구로 사용하시겠다는 답을 들었을 때는 어떻게 더 악한 나라를 도구로 쓰실 수 있는지 재차 항의합니다.

하나님의 응답을 기다리며 파수하는 자세로 서 있던 하박국은 결국 "보라 그의 마음은 교만하며 그 속에서 정직하지 못하나 의인은 그의 믿음으로 말미암아 살리라"(합 2:4)는 말씀을 받습니다. 이 구절은 훗날 로마서와 갈라디아서, 히브리서에서 이신칭의 교리의 핵심 근거로 인용됩니다. 하박국서는 무화과나무에 열매가 없고 밭에 소출이 없을지라도 "나는 여호와로 말미암아 즐거워하며"(합 3:17-18)라는 고백으로 마무리되며, 정직한 질문에서 출발해 신뢰의 고백에 이르는 신앙의 여정을 보여줍니다.`
},

"스바냐": {
  ref: "스바냐 1장~3장",
  story: `왕족 출신으로 알려진 스바냐(히스기야 왕의 후손이라는 전승도 있음)는 악한 왕 므낫세 시대의 우상숭배 잔재가 아직 남아있던 요시야 왕 초기, 종교개혁이 본격화되기 전 시점에 활동한 것으로 추정됩니다. 그는 "여호와의 날"이 가까웠음을 선포하며 유다뿐 아니라 주변 이방 나라들에 대한 심판도 함께 경고합니다.

동시에 스바냐는 심판 가운데서도 겸손히 하나님을 찾는 '남은 자'에게는 회복의 소망이 있음을 전하며, "너는 딸 시온아 노래할지어다... 여호와가 너의 하나님이 되어 너의 가운데 계시니"(습 3:14-17)라는 기쁨의 노래로 예언서를 마무리합니다. 스바냐는 심판과 회복이라는 예언서의 전형적 구조 속에서, 겸손한 남은 자를 향한 하나님의 신실한 사랑을 강조한 선지자입니다.`
},

"학개": {
  ref: "학개 1장~2장",
  story: `바벨론 포로에서 귀환한 지 16년이 지났지만 생활고와 무관심 속에 성전 재건이 중단된 채 방치되어 있던 상황에서, 학개는 다리오 왕 2년 짧은 기간 동안 집중적으로 활동한 선지자입니다. 그는 백성들이 자기 집은 판벽으로 꾸미면서 하나님의 집은 황폐한 채로 버려두었다고 지적하며 "너희는 산에 올라가서 나무를 가져다가 성전을 건축하라"고 촉구합니다(학 1:8).

학개의 메시지에 총독 스룹바벨과 대제사장 여호수아, 그리고 온 백성이 응답해 공사를 재개했고, 성전은 마침내 완공됩니다. 학개는 또한 "이 성전의 나중 영광이 이전 영광보다 크리라"(학 2:9)는 소망의 말씀을 전하며, 물질적 어려움 속에서도 하나님의 일을 우선순위에 두어야 함을 강조한 실천적인 선지자로 평가받습니다.`
},

"대제사장 여호수아": {
  ref: "학개 1장~2장, 스가랴 3장",
  story: `스룹바벨과 함께 1차 귀환민을 이끈 대제사장 여호수아(예수아)는 포로 후 회복된 제사장 직분을 상징하는 인물입니다. 스가랴서 3장에서는 그가 더러운 옷을 입고 사탄의 참소를 받는 환상 속 장면이 나오는데, 하나님은 그 더러운 옷을 벗기고 깨끗한 예복을 입히시며 "내가 네 죄악을 제거하였느니라"고 선언하십니다.

이는 개인 여호수아를 넘어, 죄로 얼룩졌던 이스라엘 공동체 전체가 하나님의 은혜로 정결하게 회복됨을 상징하는 환상으로 이해됩니다. 학개와 스가랴 모두 그를 스룹바벨과 함께 성전 재건과 예배 회복을 이끄는 지도력의 한 축으로 그리며, 정치(스룹바벨)와 종교(여호수아) 지도력이 함께 회복되는 모습을 보여줍니다.`
},

"스가랴": {
  ref: "스가랴 1장~14장",
  story: `학개와 동시대에 사역한 스가랴는 귀환 공동체를 향해 여덟 가지 밤의 환상(스 1~6장)을 통해 성전 재건과 공동체 회복을 격려합니다. 붉은 말 탄 자, 네 뿔과 네 대장장이, 측량줄을 든 사람, 더러운 옷을 벗은 대제사장 여호수아, 순금 등잔대와 두 감람나무 등 상징적인 환상들은 하나님이 여전히 자기 백성과 함께하시며 회복을 이루신다는 메시지를 담고 있습니다.

스가랴서 후반부(9~14장)는 장차 오실 메시아 왕에 대한 풍성한 예언으로 유명한데, "보라 네 왕이 네게 임하시나니... 나귀 새끼를 타셨도다"(슥 9:9)는 예수님의 예루살렘 입성으로, "내가 그 은 삼십을 세었더니"(슥 11:12-13)는 유다의 배신으로, "그들이 그 찌른 바 그를 바라보고"(슥 12:10)는 십자가 사건으로 신약에서 직접 성취되는 것으로 이해됩니다. 스가랴는 회복의 소망과 메시아 예언이 특히 풍성한 소선지서로 평가받습니다.`
},

"스룹바벨과 대제사장 여호수아": {
  ref: "학개 1장~2장, 스가랴 3~4장",
  story: `귀환 공동체의 두 지도자였던 총독 스룹바벨과 대제사장 여호수아는 각각 정치와 종교 영역에서 성전 재건이라는 공동 과업을 함께 이끌었습니다. 스가랴는 이들을 "두 기름 부음 받은 자"(슥 4:14)로 묘사하며, 성전 곁에 서 있는 두 감람나무로 상징합니다.

두 사람은 처음 제단과 성전 기초를 놓았지만 방해로 공사가 중단되었다가, 학개와 스가랴의 격려로 다시 힘을 얻어 공사를 재개해 완공에 이릅니다. 이들의 협력은 하나님의 일이 한 사람의 영웅적 리더십이 아니라, 각자의 부르심에 따라 서로 다른 역할을 감당하는 지도자들의 신실한 동역을 통해 이루어짐을 보여줍니다.`
},

"말라기": {
  ref: "말라기 1장~4장",
  story: `구약의 마지막 선지자 말라기는 성전이 재건된 지 이미 오랜 시간이 지나, 초기의 감격은 사라지고 신앙이 형식화되며 제사장과 백성이 나태해진 시기에 활동합니다. 그는 흠 있는 제물을 드리며 형식적으로 예배하는 제사장들, 십일조를 도둑질하는 백성, 이방 여인과의 통혼과 아내를 함부로 버리는 이혼 문제 등을 문답 형식으로 날카롭게 책망합니다.

동시에 말라기는 "내가 선지자 엘리야를 너희에게 보내리니 그가 아버지의 마음을 자녀에게로... 돌이키게 하리라"(말 4:5-6)며, 메시아의 길을 예비할 선구자의 도래를 예언하며 구약을 마무리합니다. 이 예언은 신약에서 세례 요한의 사역으로 성취되는 것으로 이해됩니다(마 11:14, 눅 1:17). 말라기는 형식화된 신앙을 날카롭게 책망하면서도, 마지막까지 회복의 소망을 놓지 않은 선지자입니다.`
},

"예수 그리스도": {
  ref: "사복음서 전체",
  story: `천사 가브리엘이 나사렛의 처녀 마리아에게 나타나 성령으로 잉태할 것을 알리며, 예수님은 다윗의 자손이자 하나님의 아들로 베들레헴에서 태어나십니다. 세례 요한에게 요단강에서 세례를 받으신 뒤 광야에서 40일간 금식하며 사탄의 시험을 이기시고, 갈릴리를 중심으로 공생애 사역을 시작하십니다.

예수님은 열두 제자를 부르시고, 하나님 나라의 도래를 선포하며 산상수훈 등 가르침을 베푸시는 동시에, 병자를 고치고 귀신을 쫓아내며 죽은 자를 살리는 등 수많은 표적을 행하십니다. "수고하고 무거운 짐 진 자들아 다 내게로 오라"(마 11:28)는 초청과, 죄인과 세리들을 찾아가시는 긍휼의 사역은 종교 지도자들과의 충돌을 불러왔습니다. 예루살렘에 입성하신 뒤 최후의 만찬에서 성찬을 제정하시고, 겟세마네에서 기도하신 후 제자 유다의 배신으로 체포되어 로마 총독 빌라도에게 넘겨져 십자가에 못 박혀 죽으십니다.

성경은 이 죽음이 "우리 죄를 대속하기 위한" 사건이었다고 선포하며(고전 15:3), 사흘 만에 무덤에서 부활하신 예수님은 제자들에게 여러 차례 나타나신 후 승천하십니다. 사복음서는 예수 그리스도를 각기 다른 강조점으로 조명하는데, 마태는 구약 예언의 성취자이자 왕으로, 마가는 고난받는 종으로, 누가는 소외된 자들의 구주로, 요한은 태초부터 계신 하나님의 아들(로고스)로 그려냅니다. 신약 전체는 이 예수 그리스도의 삶, 죽음, 부활을 복음의 핵심으로 선포합니다.`
},

"마태(레위)": {
  ref: "마태복음 9장, 10장",
  story: `레위라고도 불리는 마태는 로마 제국을 위해 동족에게서 세금을 거두던 세리로, 유대 사회에서 죄인 취급을 받으며 멸시받던 직업에 종사하고 있었습니다. 예수님은 세관에 앉아 있던 그에게 "나를 따르라" 한마디를 건네셨고, 마태는 곧바로 모든 것을 버려두고 예수님을 따릅니다(마 9:9).

마태는 자신의 집에서 예수님과 다른 세리·죄인들을 위한 잔치를 베풀었는데, 이를 비판하는 바리새인들에게 예수님은 "건강한 자에게는 의사가 쓸데없고 병든 자에게라야 쓸 데 있느니라... 나는 의인을 부르러 온 것이 아니요 죄인을 부르러 왔노라"고 답하십니다(마 9:12-13). 전통적으로 마태는 열두 사도 중 한 사람이 되었을 뿐 아니라, 예수님의 생애와 가르침을 유대인 독자를 위해 기록한 마태복음의 저자로 전해집니다.`
},

"베드로": {
  ref: "사복음서, 사도행전, 베드로전후서",
  story: `갈릴리의 어부였던 시몬은 예수님의 부르심을 받아 제자가 되며 '반석'이라는 뜻의 베드로라는 이름을 얻습니다. 그는 열두 제자 중 가장 앞장서는 인물로, "주는 그리스도시요 살아 계신 하나님의 아들이시니이다"(마 16:16)라는 신앙 고백을 했으며, 예수님은 이 고백 위에 교회를 세우겠다고 말씀하십니다.

그러나 베드로는 예수님이 십자가를 지실 것을 예고하실 때 만류하다 꾸지람을 듣기도 했고, 예수님이 체포되신 밤에는 세 번이나 그분을 모른다고 부인하는 큰 실패를 겪습니다. 부활하신 예수님은 디베랴 호수에서 베드로에게 "네가 나를 사랑하느냐"고 세 번 물으시며 그를 회복시키시고 "내 양을 먹이라"는 사명을 다시 맡기십니다(요 21장).

오순절 성령강림 후 베드로는 예루살렘 초대교회를 이끄는 대표적 사도로 세워져, 첫 설교로 삼천 명이 회개하는 역사를 이룹니다. 이후 고넬료 사건을 통해 이방인에게도 복음이 열려 있음을 확인하며, 베드로전후서를 통해 박해받는 성도들에게 소망을 전합니다. 한때 예수님을 부인했던 자신처럼, 연약함 속에서도 다시 일어설 수 있다는 메시지를 전하는 인물입니다.`
},

"마리아": {
  ref: "누가복음 1장~2장, 요한복음 2장, 19장",
  story: `나사렛의 처녀 마리아는 천사 가브리엘로부터 성령으로 잉태하여 하나님의 아들을 낳을 것이라는 놀라운 소식을 듣습니다. 인간적으로 이해할 수 없는 상황이었지만, "주의 여종이오니 말씀대로 내게 이루어지이다"(눅 1:38)라는 순종의 응답으로 이를 받아들입니다.

마리아는 사촌 엘리사벳을 방문해 "내 영혼이 주를 찬양하며"로 시작하는 '마리아의 찬가'(눅 1:46-55)를 부르며, 낮은 자를 높이시는 하나님을 찬양합니다. 베들레헴에서 예수님을 낳은 뒤, 애굽으로의 피난, 성전에서 소년 예수를 잃어버렸다 찾은 일 등 여러 사건을 겪으며 어머니로서의 삶을 살아갑니다. 가나 혼인잔치에서는 예수님께 문제를 알리며 신뢰를 보였고, 십자가 아래서는 아들의 죽음을 지켜보는 고통을 겪습니다. 예수님은 십자가 위에서도 제자 요한에게 어머니를 부탁하실 만큼 마리아를 마음에 두셨습니다. 마리아는 순종하는 믿음의 모델로 성경 전체에서 존중받는 인물입니다.`
},

"세례 요한": {
  ref: "누가복음 1장, 3장, 마태복음 3장, 11장, 14장",
  story: `제사장 사가랴와 엘리사벳 사이에서 늦둥이로 태어난 요한은 태어나기 전부터 "주 앞에 앞서 가서 그 길을 준비"할 자로 예언되었습니다(눅 1:76). 낙타털 옷을 입고 메뚜기와 석청을 먹으며 광야에서 지낸 그는, 요단강에서 회개의 세례를 베풀며 "회개하라 천국이 가까이 왔느니라"고 외쳐 큰 무리를 이끌었습니다.

요한은 예수님께도 세례를 베풀었는데, 그 순간 하늘이 열리고 성령이 비둘기같이 임하며 "이는 내 사랑하는 아들이라"는 음성이 들립니다(마 3:16-17). 요한은 스스로를 "그의 신발끈을 풀기도 감당하지 못하겠노라"며 낮추었고(마 3:11), 예수님을 향해 "보라 세상 죄를 지고 가는 하나님의 어린 양이로다"(요 1:29)라고 증거했습니다. 이후 분봉왕 헤롯의 부도덕함을 책망하다 옥에 갇혔고, 헤롯의 생일잔치에서 헤로디아의 딸의 요구로 참수당해 순교합니다. 예수님은 그를 "여자가 낳은 자 중에 요한보다 큰 이가 없도다"라고 평가하시며(마 11:11), 메시아의 길을 예비한 선구자로 인정하셨습니다.`
},

"사도 요한": {
  ref: "사복음서, 요한1·2·3서, 요한계시록",
  story: `갈릴리 어부 세베대의 아들 요한은 형 야고보와 함께 예수님의 부르심을 받아 제자가 되었고, 베드로·야고보와 함께 변화산 사건, 겟세마네 기도 등 예수님의 가장 가까운 순간들을 함께한 핵심 제자였습니다. 그는 자신을 "예수께서 사랑하시는 제자"로 표현하며(요 13:23, 21:20), 최후의 만찬에서 예수님 품에 의지해 앉았고, 십자가 아래 끝까지 남아있던 제자로 예수님으로부터 어머니 마리아를 부탁받았습니다.

전통적으로 요한은 네 복음서 중 가장 신학적으로 깊은 요한복음과, 사랑과 진리를 강조하는 요한1·2·3서를 기록했습니다. 노년에 신앙 때문에 밧모섬에 유배되었을 때, 그는 부활하신 그리스도의 압도적인 환상을 보고 소아시아 일곱 교회를 향한 계시를 받아 요한계시록을 기록합니다. 요한은 '사랑의 사도'로 불리며, 참된 교제와 사랑, 그리고 그리스도의 궁극적 승리에 대한 소망을 평생에 걸쳐 증거한 인물입니다.`
},

"스데반": {
  ref: "사도행전 6장~7장",
  story: `초대교회가 구제 문제로 어려움을 겪을 때 뽑힌 일곱 집사 중 한 사람인 스데반은 "믿음과 성령이 충만한 사람"으로 소개되며, 큰 기사와 표적을 행했습니다(행 6:5,8). 그러나 그의 담대한 복음 증거에 반발한 유대인들은 그를 거짓 증인으로 모함해 공회 앞에 세웁니다.

공회 앞에서 스데반은 아브라함부터 예수 그리스도까지 이스라엘 역사 전체를 통해 하나님의 구속 계획을 웅변적으로 설명하며, 오히려 청중들의 완악함을 정면으로 지적합니다. 격분한 무리는 그를 성 밖으로 끌어내어 돌로 쳐 죽였는데, 스데반은 죽어가면서도 "주 예수여 내 영혼을 받으시옵소서... 이 죄를 그들에게 돌리지 마옵소서"라며 예수님처럼 용서를 구하는 기도를 드립니다(행 7:59-60). 이 죽음의 현장에는 훗날 사도가 되는 사울(바울)이 지켜보고 있었습니다. 스데반은 복음을 증거하다 죽은 초대교회 최초의 순교자로, 이후 대박해가 시작되는 계기가 되면서 오히려 복음이 예루살렘 밖으로 확산되는 전환점이 됩니다.`
},

"바울": {
  ref: "사도행전 9장~28장, 바울서신 전체",
  story: `본래 사울이라는 이름의 바리새인으로, 길리기아 다소 출신의 로마 시민권자였던 바울은 초대교회를 핍박하는 데 앞장서 스데반의 순교 현장에 있었고, 그리스도인들을 잡아 옥에 넘기려 다메섹으로 가던 중 하늘에서 비추는 강렬한 빛과 함께 부활하신 예수님을 만나는 극적인 회심을 경험합니다. "사울아 사울아 네가 어찌하여 나를 박해하느냐"는 음성 앞에 그는 눈이 멀었다가, 사흘 후 아나니아를 통해 다시 보게 되고 세례를 받습니다(행 9장).

이후 바울은 박해자에서 이방인을 향한 사도로 극적으로 변화되어, 세 차례의 전도여행을 통해 소아시아와 그리스 전역에 교회를 세웁니다. 그는 매질과 투옥, 파선, 돌에 맞는 등 숱한 고난 속에서도 복음을 전했고(고후 11장), 로마에 갇힌 중에도 옥중서신을 기록했습니다. 로마서, 고린도전후서, 갈라디아서 등 그의 편지들은 이신칭의 복음, 그리스도의 십자가와 부활, 교회론 등 기독교 신학의 근간을 이루는 신학적 유산으로 남아있습니다. 전승에 따르면 바울은 로마에서 순교했으며, 죽음을 앞두고 "내가 선한 싸움을 싸우고 나의 달려갈 길을 마치고 믿음을 지켰으니"(딤후 4:7)라고 고백했습니다.`
},

"고린도교회 성도들": {
  ref: "고린도전서 1장~16장",
  story: `항구도시 고린도는 상업이 번성하고 다양한 문화와 종교가 뒤섞인 향락적인 도시였습니다. 바울이 세운 고린도교회 성도들은 이런 배경 속에서 신앙을 갖게 되었지만, 교회 안에 바울파·아볼로파·게바파로 나뉘는 분파주의, 근친상간 같은 심각한 윤리적 문제, 성도 간의 소송, 우상에게 바친 제물 문제, 예배 중 은사 사용의 혼란 등 다양한 갈등을 겪고 있었습니다.

바울은 이들에게 보낸 편지에서 십자가의 도를 중심으로 교회의 연합을 촉구하고, 특히 고린도전서 13장의 사랑 장을 통해 어떤 은사도 사랑 없이는 무익하다고 가르칩니다. 고린도교회 성도들은 은사와 지식은 풍성했지만 성숙이 부족했던 초대교회의 현실을 보여주는 동시에, 바울의 목회적 권면을 통해 성장해가는 신앙 공동체의 모습을 대표합니다.`
},

"유대주의자들": {
  ref: "갈라디아서 1장~6장, 사도행전 15장",
  story: `유대주의자들은 예수를 믿는 이방인 신자들에게도 할례를 비롯한 모세 율법의 준수를 구원의 필수 조건으로 강요했던 그룹입니다. 이들은 갈라디아 지역의 교회들에 들어와 "오직 믿음"이라는 바울의 복음이 불완전하다고 주장하며 성도들을 혼란에 빠뜨렸습니다.

바울은 갈라디아서에서 이들의 가르침이 복음의 본질을 왜곡한다고 강하게 경계하며, "다른 복음은 없나니 다만 너희를 교란하여 그리스도의 복음을 변하게 하려는 어떤 사람들"이라고 단호히 비판합니다(갈 1:7). 이 문제는 예루살렘 공회(행 15장)에서 공식적으로 다뤄졌고, 이방인 신자에게 할례를 강요하지 않기로 결정됨으로써 복음의 은혜 중심 원리가 확인됩니다. 유대주의자들은 율법 준수를 구원의 조건으로 삼으려 한 대표적 반대자로, 오직 믿음으로 얻는 은혜의 복음을 더욱 선명하게 부각시키는 역할을 합니다.`
},

"에바브로디도": {
  ref: "빌립보서 2장, 4장",
  story: `빌립보교회가 로마 감옥에 갇힌 바울을 돕기 위해 파송한 사자인 에바브로디도는, 헌금과 물품을 전달하는 임무를 수행하다가 죽을 만큼 심한 병에 걸립니다. 바울은 그를 "나의 형제요 함께 수고하고 함께 군사 된 자요 너희 사자로 나의 쓸 것을 돕는 자"라 부르며 깊은 애정을 표현합니다(빌 2:25).

에바브로디도는 자신이 병든 사실이 빌립보교회에 알려져 성도들이 걱정할 것을 오히려 근심할 만큼 헌신적인 성품을 지녔습니다. 바울은 그를 존귀히 여기라고 당부하며 빌립보로 돌려보냈는데, 이는 자신의 몸을 돌보지 않고 섬김의 사명을 감당한 헌신적 동역자의 대표적 사례로 기억됩니다.`
},

"에바브라": {
  ref: "골로새서 1장, 4장, 빌레몬서 1장",
  story: `골로새교회를 세운 것으로 전해지는 에바브라는 바울의 동역자로, 골로새뿐 아니라 인근 라오디게아와 히에라볼리 교회를 위해서도 수고했습니다. 바울은 그를 "우리와 함께 그리스도의 신실한 일꾼"이라 칭하며(골 1:7), 그가 성도들을 위해 "항상 애써 기도"한다고 전합니다(골 4:12-13).

당시 골로새교회에는 철학과 신비주의, 율법주의가 혼합된 이단 사상이 침투해 있었는데, 에바브라는 이 상황을 바울에게 알려 골로새서가 기록되는 계기를 마련한 것으로 이해됩니다. 그는 눈에 띄는 화려한 사역보다 기도와 목양으로 교회를 세운 신실한 동역자로 기억됩니다.`
},

"바울, 실라, 디모데": {
  ref: "데살로니가전서 1장, 사도행전 16장~17장",
  story: `2차 전도여행 중 바울은 실라, 디모데와 함께 빌립보를 거쳐 데살로니가에 도착해 복음을 전했습니다. 회당에서 몇 안식일 동안 강론한 결과 여러 유대인과 많은 헬라인, 적지 않은 귀부인들이 믿게 되었지만, 시기한 유대인들의 소동으로 이들은 급히 베뢰아로, 이어 아덴으로 피신해야 했습니다(행 17장).

데살로니가전서는 이렇게 짧은 기간 세워진 교회가 극심한 박해 속에서도 신앙을 지킨 것에 대한 바울, 실라, 디모데 세 사람의 공동 감사와 격려의 편지입니다. 이들은 갓 세워진 교회를 향해 "젖 먹는 자기 자녀를 기르는 유모"처럼 부드럽게, 동시에 아버지처럼 권면하고 위로했다고 회고하며(살전 2:7,11), 전도팀으로서의 신실한 동역을 보여줍니다.`
},

"디모데": {
  ref: "사도행전 16장, 디모데전후서",
  story: `루스드라 출신인 디모데는 유대인 어머니 유니게와 헬라인 아버지 사이에서 태어났고, 외조모 로이스와 어머니로부터 어려서부터 신앙 교육을 받았습니다(딤후 1:5, 3:15). 바울은 2차 전도여행 중 그를 만나 동역자로 삼았고, 이후 디모데는 바울의 가장 신실한 영적 아들이자 동역자로 여러 전도여행과 옥중 사역을 함께합니다.

바울은 젊은 나이에 에베소교회를 맡게 된 디모데에게 두 통의 목회서신을 보내, 건강한 교회 조직과 지도자의 자격, 거짓 교훈에 대한 경계 등 실제적인 목회 지침을 가르칩니다. 특히 순교를 앞두고 쓴 디모데후서에서는 "네 나이를 젊다고 업신여기지 못하게 하고... 믿는 자에게 본이 되어"(딤전 4:12)라는 당부와 함께, 복음을 위해 끝까지 헌신할 것을 격려합니다. 디모데는 스승의 신앙 유산을 이어받아 다음 세대에 전달하는 후계자의 모범을 보여줍니다.`
},

"디도": {
  ref: "디도서 1장~3장, 고린도후서 7장, 8장",
  story: `이방인 출신으로 추정되는 디도는 바울의 신실한 동역자로, 특히 갈등이 많았던 고린도교회와 바울 사이의 화해를 중재하는 데 중요한 역할을 감당했습니다(고후 7:6-7). 바울은 그를 그레데섬에 남겨두어 아직 정비되지 않은 신생 교회의 질서를 세우도록 맡깁니다.

디도서에서 바울은 그에게 각 성에 장로를 세우는 기준과, 건전한 교훈에 따른 삶의 모범을 제시하며, "너는 범사에 네 자신이 선한 일의 본을 보이라"고 권면합니다(딛 2:7). 디도는 어려운 상황의 교회를 안정적으로 세워가는 실무형 지도자로서 바울의 깊은 신뢰를 받았던 인물입니다.`
},

"빌레몬": {
  ref: "빌레몬서 1장",
  story: `골로새 지역의 유력한 그리스도인이었던 빌레몬은 바울을 통해 복음을 듣고 회심한 인물로, 자기 집을 교회 모임 장소로 제공할 만큼 신앙이 깊고 성도들을 향한 사랑이 널리 알려진 사람이었습니다(몬 1:5,7).

그의 노예였던 오네시모가 도망친 후 로마에서 바울을 만나 회심하자, 바울은 오네시모를 다시 빌레몬에게 돌려보내며 그를 "종과 같이 대하지 아니하고 종 이상으로 곧 사랑받는 형제로" 받아달라고 간곡히 부탁하는 편지를 씁니다(몬 1:16). 빌레몬은 신분과 사회적 관습을 넘어, 그리스도 안에서 형제로 용서하고 받아들이라는 복음의 요청을 받은 인물로, 이 짧은 편지는 복음이 인간관계와 사회 구조에까지 미치는 영향력을 잘 보여줍니다.`
},

"오네시모": {
  ref: "빌레몬서 1장, 골로새서 4장",
  story: `빌레몬의 노예였던 오네시모('유익한 자'라는 뜻)는 주인에게서 도망쳐 나왔고, 어떤 경위에서인지 로마 감옥에 있던 바울을 만나게 되어 그를 통해 회심합니다. 바울은 그를 "갇힌 중에서 낳은 아들"이라 부를 만큼 각별한 애정을 갖게 되었고, 그가 이제는 이름 그대로 "유익한 자"가 되었다고 표현합니다(몬 1:10-11).

바울은 오네시모를 다시 빌레몬에게 돌려보내면서, 그를 도망친 노예가 아니라 사랑받는 형제로 받아달라고 부탁하는 편지(빌레몬서)를 들려 보냅니다. 오네시모는 사회적으로 가장 낮은 신분이었지만 그리스도 안에서 신분을 넘어선 형제로 다시 태어난 인물로, 복음이 가져오는 근본적인 신분의 변화를 상징적으로 보여줍니다.`
},

"구약의 믿음의 선진들": {
  ref: "히브리서 11장",
  story: `히브리서 11장은 아벨, 에녹, 노아, 아브라함, 사라, 이삭, 야곱, 요셉, 모세, 라합에서부터 사사들과 다윗, 사무엘과 선지자들에 이르기까지, 구약의 수많은 인물들을 "믿음"이라는 하나의 주제로 꿰어내는 '믿음 장'으로 불립니다. "믿음은 바라는 것들의 실상이요 보지 못하는 것들의 증거"(히 11:1)라는 정의로 시작해, 이들이 약속을 보지 못한 채로도 하나님을 신뢰하며 살아간 삶을 나열합니다.

이 인물들은 어떤 이는 기적적인 승리를, 어떤 이는 고문과 죽음까지 감내하는 고난을 겪었지만, "이 사람들은 다 믿음으로 죽었으며 약속을 받지 못하였으되 그것들을 멀리서 보고 환영"했다고 기록됩니다(히 11:13). 히브리서 저자는 이 구름 같은 허다한 증인들을 근거로, 박해받던 유대계 그리스도인 독자들에게 "인내로써 우리 앞에 당한 경주를 하며" 믿음의 길을 끝까지 달려가라고 권면합니다(히 12:1).`
},

"야고보": {
  ref: "야고보서 1장~5장, 사도행전 15장",
  story: `예수님의 육신의 형제였던 야고보는 예수님의 공생애 동안에는 그를 메시아로 믿지 않았던 것으로 보이지만(요 7:5), 부활하신 예수님이 그에게 나타나신 후(고전 15:7) 믿음의 사람이 되어 예루살렘교회의 핵심 지도자로 세워집니다. 사도행전 15장 예루살렘 공회에서는 이방인 신자들에게 할례를 강요하지 않기로 하는 중요한 결정을 이끄는 지도적 역할을 감당합니다.

야고보서에서 그는 로마 제국 전역에 흩어져 살던 유대계 그리스도인들에게, 말로만 하는 믿음이 아니라 삶의 실천으로 증명되는 살아있는 믿음을 강조합니다. "영혼 없는 몸이 죽은 것같이 행함이 없는 믿음은 죽은 것이니라"(약 2:26)는 말씀은 그의 실천적 신앙관을 대표합니다. 야고보는 형제로서 처음엔 예수님을 믿지 못했으나 이후 초대교회의 든든한 기둥이 된 인물로 기억됩니다(갈 2:9).`
},

"요한": {
  ref: "사복음서, 요한1·2·3서, 요한계시록",
  story: `갈릴리 어부 세베대의 아들 요한은 형 야고보와 함께 예수님의 부르심을 받아 제자가 되었고, 베드로·야고보와 함께 변화산 사건, 겟세마네 기도 등 예수님의 가장 가까운 순간들을 함께한 핵심 제자였습니다. 그는 자신을 "예수께서 사랑하시는 제자"로 표현하며(요 13:23, 21:20), 최후의 만찬에서 예수님 품에 의지해 앉았고, 십자가 아래 끝까지 남아있던 제자로 예수님으로부터 어머니 마리아를 부탁받았습니다.

function routeViewBox(pts){
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  let minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  let w = maxX-minX, h = maxY-minY;
  const padX = Math.max(w*0.28, 45), padY = Math.max(h*0.28, 45);
  minX -= padX; maxX += padX; minY -= padY; maxY += padY;
  w = maxX-minX; h = maxY-minY;
  const ratio = 1.5;
  if (w/h > ratio) { const nh = w/ratio; const cy=(minY+maxY)/2; minY=cy-nh/2; maxY=cy+nh/2; h=nh; }
  else { const nw = h*ratio; const cx=(minX+maxX)/2; minX=cx-nw/2; maxX=cx+nw/2; w=nw; }
  return [minX, minY, w, h];
}

function ensureFigureModal(){
  if (document.getElementById('figureModalOverlay')) return;
  const overlay = document.createElement('div');
  overlay.id = 'figureModalOverlay';
  overlay.className = 'figure-modal-overlay';
  overlay.innerHTML = '<div class="figure-modal-box"><div class="figure-modal-close">닫기 ✕</div><div id="figureModalContent"></div></div>';
  overlay.addEventListener('click', function(e){ if(e.target===overlay) closeFigureModal(); });
  overlay.querySelector('.figure-modal-close').addEventListener('click', closeFigureModal);
  document.body.appendChild(overlay);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeFigureModal(); });
}
function openFigureModal(el){
  ensureFigureModal();
  const name = el.dataset.name;
  const meaningEl = el.querySelector('.figure-meaning');
  const meaning = meaningEl ? meaningEl.textContent : '';
  const detail = FIGURE_DETAILS[name];
  const content = document.getElementById('figureModalContent');
  if (detail){
    const paragraphs = detail.story.trim().split(/\n\s*\n/).map(p=>'<p>'+escapeHtml(p.trim()).replace(/\n/g,' ')+'</p>').join('');
    content.innerHTML =
        '<h2 class="figure-modal-title">'+escapeHtml(name)+'</h2>'
      + '<div class="figure-modal-ref">📖 '+escapeHtml(detail.ref)+'</div>'
      + (meaning ? '<div class="figure-modal-summary">'+escapeHtml(meaning)+'</div>' : '')
      + '<div class="figure-modal-story">'+paragraphs+'</div>';
  } else {
    content.innerHTML =
        '<h2 class="figure-modal-title">'+escapeHtml(name)+'</h2>'
      + (meaning ? '<div class="figure-modal-summary">'+escapeHtml(meaning)+'</div>' : '')
      + '<div class="figure-modal-story"><p>이 인물에 대한 상세 이야기는 준비 중입니다.</p></div>';
  }
  document.getElementById('figureModalOverlay').classList.add('active');
}
function closeFigureModal(){
  const o = document.getElementById('figureModalOverlay');
  if (o) o.classList.remove('active');
}


const CATS = ["전체","오경","역사서","시가서","대선지서","소선지서","복음서","바울서신","일반서신","예언서"];

let state = { testament:"all", cat:"전체", q:"" };

  function renderChips(){
  const row = document.getElementById("chipRow");
  row.innerHTML = "";
  CATS.forEach(c=>{
        const el = document.createElement("div");
        el.className = "chip" + (state.cat===c ? " active":"");
    el.textContent = c;
    el.onclick = ()=>{ state.cat=c; renderChips(); renderGrid(); };
    row.appendChild(el);
});
}

function renderGrid(){
    const grid = document.getElementById("grid");
  const noResult = document.getElementById("noResult");
  grid.innerHTML = "";
  const q = state.q.trim();
  const filtered = BOOKS.filter(b=>{
    if(state.testament!=="all" && b.t!==state.testament) return false;
    if(state.cat!=="전체" && b.cat!==state.cat) return false;
    if(q && !(b.name.includes(q) || (b.figures||[]).some(f=>f[0].includes(q)))) return false;
    return true;
});
  document.getElementById("resultCount").textContent = `${filtered.length}권 표시 중 (전체 66권)`;
  noResult.style.display = filtered.length ? "none" : "block";
  filtered.forEach(b=>{
        const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
            <div class="card-top">
              <span class="card-num">${String(b.n).padStart(2,"0")}</span>
              <span class="badge ${b.t==="구약"?"ot":"nt"}">${b.t}</span>
            </div>
            <h3>${b.name}</h3>
            <div class="cat">${b.cat}</div>
            <div class="info-row"><b>저자</b><span>${b.author}</span></div>
            <div class="info-row"><b>기록시기</b><span>${b.date}</span></div>
            <div class="section-label">시대적 배경</div>
            <div class="section-text">${b.bg}</div>
            <div class="section-label">기록 목적</div>
            <div class="section-text">${b.purpose}</div>
            ${b.figures ? `<div class="section-label">등장 인물 (클릭하면 상세 이야기)</div><div class="figure-list">${b.figures.map(f=>`<div class="figure-item" data-name="${escapeAttr(f[0])}" onclick="openFigureModal(this)"><span class="figure-name">${f[0]}</span><span class="figure-meaning">${f[1]}</span></div>`).join("")}</div>` : ""}
            ${b.route ? `<div class="section-label">이동경로</div><div class="route-map" onclick="openMapModal(this)">${renderRouteMapSVG(b.route)}</div>` : ""}
            ${b.route ? `<div class="section-label">이동경로 (현재 지도 기준)</div><div class="route-map" onclick="openMapModal(this)">${renderRealMapSVG(b.route)}</div>` : ""}
            ${b.note ? `<div class="note">※ ${b.note}</div>` : ""}
            ${b.links ? `<div class="section-label">더 깊이 보기</div><div class="deepdive-links">${b.links.map(l=>`<a class="deepdive-link" href="${escapeAttr(l[1])}" target="_blank" rel="noopener">${escapeHtml(l[0])}</a>`).join("")}</div>` : ""}
    `;
    grid.appendChild(card);
});
}

document.querySelectorAll(".testament-toggle button").forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll(".testament-toggle button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    state.testament = btn.dataset.t;
    renderGrid();
};
});

document.getElementById("searchInput").addEventListener("input", (e)=>{
    state.q = e.target.value;
  renderGrid();
});

renderChips();
renderGrid();
</script>
